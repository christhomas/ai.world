<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI World</title>
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <div id="loading">Generating World...</div>
  <div id="gameContainer"></div>
  <div id="areaName">The Crossroads</div>
  <div id="minimap"><canvas id="minimapCanvas" width="180" height="180"></canvas></div>
  <div id="inventory"></div>
  <div id="controls">
    <h4>Controls</h4>
    <div>WASD / Arrows - Walk</div>
    <div>Q/E - Rotate Camera</div>
    <div>Scroll - Zoom</div>
    <div>Enter / Space - Talk (or click)</div>
    <div>M - Toggle map zoom</div>
    <div>F - Free camera (drag to pan)</div>
    <div>N - New World</div>
    <div>O - Options</div>
  </div>
  <div id="optionsPanel">
    <h3>Options</h3>
    <div class="slider-group">
      <label>Sunlight Intensity</label>
      <input type="range" id="sunlightSlider" min="0" max="6" step="0.1" value="2.6" />
      <div class="value-display" id="sunlightValue">2.6</div>
    </div>
    <div class="slider-group">
      <label>Sky Light Intensity</label>
      <input type="range" id="hemisphereSlider" min="0" max="3" step="0.05" value="1.0" />
      <div class="value-display" id="hemisphereValue">1.0</div>
    </div>
    <div class="slider-group">
      <label>Seed</label>
      <div class="value-display" id="seedValue">-</div>
    </div>
    <div class="close-hint">Press ESC or O to close</div>
  </div>
  <div id="toast"></div>
  <div id="debug"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
