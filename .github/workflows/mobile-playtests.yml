name: Hosted mobile evidence

on:
  pull_request:
    paths:
      - 'client/flutter/**'
      - 'tools/mobile/**'
      - 'src/**'
      - 'server/protocol.ts'
      - 'shared/mobile/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-playtests.yml'
      - 'docs/mobile-hosted-verification.md'
      - 'tools/playtest-record.ts'
      - 'tools/shots.cjs'
      - 'server/flutter-packet.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The scenes both phones replay, photographed in the real game on this commit (#569): the square
  # at noon and at night, autumn, the general store, a dungeon floor, and a boat at sea by day and
  # by night. Each is the exact packet the Flutter feed sends and the web canvas that drew that same
  # frame, with a checksum file the native jobs verify before drawing or comparing anything.
  frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Photograph the parity scenes on the web, keeping the frame each one drew
        run: node tools/shots.cjs town night autumn winter cattle mountain farming horse estate interior dungeon sea night-sea
        env:
          PORT: '5186'
          PARITY: ${{ runner.temp }}/parity-kept
          OUT: ${{ runner.temp }}/parity-shots
      - name: Turn the kept frames into the packets the phones replay
        run: pnpm exec tsx tools/mobile/parity-packets.ts "$RUNNER_TEMP/parity-kept" "$RUNNER_TEMP/parity-frames"
      - name: Checksum what the phones will draw and be compared with
        run: cd "$RUNNER_TEMP/parity-frames" && sha256sum *.json web/* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: parity-frames
          path: ${{ runner.temp }}/parity-frames
          if-no-files-found: error
          retention-days: 30

  android-native:
    needs: frames
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.1
          channel: stable
      - run: python3 -m pip install Pillow==11.3.0
      # the web player the installed journey meets in a shared world (#583)
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: parity-frames
          path: ${{ runner.temp }}/parity-frames
      - name: Build production native replay on hosted runner
        run: python3 tools/mobile/hosted.py prepare android
        env:
          PARITY_FRAMES: ${{ runner.temp }}/parity-frames
      - name: Put the Android shaders through the reference GLSL compiler
        run: |
          sudo apt-get install -y glslang-tools
          python3 tools/mobile/glsl.py
      - name: Enable and require hosted KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [ ! -c /dev/kvm ]; then
            echo '::error::Hosted runner has no /dev/kvm device; accelerated Android provisioning cannot continue.'
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run dedicated GLES emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: hosted-native-evidence
          force-avd-creation: true
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -accel on -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # the renderer's frames, then the installed journey by touch (#584) on the same emulator; both run, and either failing fails the step
          script: python3 tools/mobile/hosted.py capture android; capture=$?; python3 tools/mobile/journey.py android; journey=$?; [ $capture -eq 0 ] && [ $journey -eq 0 ]
      - name: Compare each native frame with the web picture of it
        run: python3 tools/mobile/hosted.py compare android
        env:
          PARITY_FRAMES: ${{ runner.temp }}/parity-frames
      - name: Self-contained report including failures and pending gameplay
        if: always()
        run: python3 tools/mobile/hosted.py report android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-android-evidence
          path: ${{ runner.temp }}/mobile-evidence
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-android-journey
          path: ${{ runner.temp }}/mobile-journey
          if-no-files-found: error
          retention-days: 30

  ios-native:
    needs: frames
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.1
          channel: stable
      - run: python3 -m venv "$RUNNER_TEMP/mobile-python"
      - run: |
          "$RUNNER_TEMP/mobile-python/bin/pip" install Pillow==11.3.0
      # the web player the installed journey meets in a shared world (#583)
      - run: pnpm exec playwright install chromium
      - uses: actions/download-artifact@v4
        with:
          name: parity-frames
          path: ${{ runner.temp }}/parity-frames
      - name: Build production native replay on hosted runner
        run: |
          "$RUNNER_TEMP/mobile-python/bin/python" tools/mobile/hosted.py prepare ios
        env:
          PARITY_FRAMES: ${{ runner.temp }}/parity-frames
      - name: Run dedicated Metal simulator
        run: |
          "$RUNNER_TEMP/mobile-python/bin/python" tools/mobile/hosted.py capture ios
      - name: Compare each native frame with the web picture of it
        run: |
          "$RUNNER_TEMP/mobile-python/bin/python" tools/mobile/hosted.py compare ios
        env:
          PARITY_FRAMES: ${{ runner.temp }}/parity-frames
      - name: Self-contained report including failures and pending gameplay
        if: always()
        run: |
          "$RUNNER_TEMP/mobile-python/bin/python" tools/mobile/hosted.py report ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ios-evidence
          path: ${{ runner.temp }}/mobile-evidence
          if-no-files-found: error
          retention-days: 30
      - name: The installed journey by touch on its own simulator (#584)
        if: always()
        # its own limit inside the job's, so a journey that runs long fails here and its report is still
        # uploaded below, rather than the whole job being cancelled with nothing to show (2026-10-17)
        timeout-minutes: 80
        run: |
          "$RUNNER_TEMP/mobile-python/bin/python" tools/mobile/journey.py ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ios-journey
          path: ${{ runner.temp }}/mobile-journey
          if-no-files-found: error
          retention-days: 30
