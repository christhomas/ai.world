name: Hosted mobile evidence

on:
  pull_request:
    paths:
      - 'client/flutter/**'
      - 'tools/mobile/**'
      - 'src/**'
      - 'server/protocol.ts'
      - 'shared/mobile/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-playtests.yml'
      - 'docs/mobile-hosted-verification.md'
  workflow_dispatch:
    inputs:
      gate:
        description: Renderer smoke or installed gameplay (currently blocked prerequisites)
        type: choice
        options: [renderer, gameplay]
        default: renderer

permissions:
  contents: read

concurrency:
  group: mobile-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.1
          channel: stable
      - run: python3 -m pip install Pillow==11.3.0
      - name: Build production native replay on hosted runner
        run: python3 tools/mobile/hosted.py prepare android
      - name: Enable and require hosted KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [ ! -c /dev/kvm ]; then
            echo '::error::Hosted runner has no /dev/kvm device; accelerated Android provisioning cannot continue.'
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run dedicated GLES emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: hosted-native-evidence
          force-avd-creation: true
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -accel on -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/mobile/hosted.py capture android
      - name: Self-contained report including failures and pending gameplay
        if: always()
        run: python3 tools/mobile/hosted.py report android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-android-evidence
          path: ${{ runner.temp }}/mobile-evidence
          if-no-files-found: error
          retention-days: 30

  ios-native:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.1
          channel: stable
      - run: python3 -m venv "$RUNNER_TEMP/mobile-python"
      - run: |
          "$RUNNER_TEMP/mobile-python/bin/pip" install Pillow==11.3.0
      - name: Build production native replay on hosted runner
        run: python3 tools/mobile/hosted.py prepare ios
      - name: Run dedicated Metal simulator
        run: |
          "$RUNNER_TEMP/mobile-python/bin/python" tools/mobile/hosted.py capture ios
      - name: Self-contained report including failures and pending gameplay
        if: always()
        run: python3 tools/mobile/hosted.py report ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ios-evidence
          path: ${{ runner.temp }}/mobile-evidence
          if-no-files-found: error
          retention-days: 30

  installed-gameplay:
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'gameplay'
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse to count renderer replay as installed gameplay
        run: |
          echo '::error::Installed gameplay is pending #558 #563 #564 #571 #572. No executable offline session/touch/save journey exists. Renderer smoke cannot satisfy #584.'
          exit 78
