# The gate: types, tests, and the collision bench, on the way in rather than on the way out.
#
# Everything that has gone wrong with this game's collisions went wrong in the same way — the
# arithmetic was right and the world was wrong, and the only thing that noticed was somebody walking
# about in it. `chore collisions` is that walk, done by a machine: every creature into every solid,
# from every side, at three speeds, with an account of what it did. It costs a second and a half,
# and it is the difference between finding a wall in the sky here and finding it in a village.
#
# It runs the same task a person runs at their desk. A pipeline with its own private incantation is
# a pipeline whose failures cannot be reproduced, so this installs `chore` and asks it for `check`,
# exactly as anybody would.
#
# Two jobs, because they cost different amounts and are wanted at different moments. `check` is
# seconds and gates a commit. `playtest` opens a browser, plays the game for a minute and a half and
# says whether what is drawn is what the world has — the only check here that looks at the screen,
# and the one that would have caught every fault of the day it was written. It is deliberately not
# inside `chore check`: a gate that costs two minutes stops being run before a commit, and then it
# is not a gate. Here they run side by side, so the slow one costs the pipeline nothing in wall
# clock and still turns the whole thing red on its own.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  # so a failing bench can be re-run without pushing anything
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same task runner the repository is driven by, pinned. `chores.yml` asks for 0.9.0 or
      # better; this is the version the tasks were last run against by hand.
      # Unpacked outside the checkout, because the tarball carries a README.md of its own. This
      # used to extract in the working directory, so every run quietly replaced THIS repository's
      # README with chore's — and nothing noticed for as long as nothing read the README. A test
      # that did reported a file full of headings like "Why not mise" and "Supported subset".
      - name: Install chore
        env:
          CHORE_VERSION: 0.10.1
        run: |
          set -euo pipefail
          unpack=$(mktemp -d)
          curl -fsSL -o "$unpack/chore.tar.gz" \
            "https://github.com/antimatter-studios/chore/releases/download/v${CHORE_VERSION}/chore-${CHORE_VERSION}-linux-x86_64.tar.gz"
          tar -xzf "$unpack/chore.tar.gz" -C "$unpack"
          sudo install -m 0755 "$unpack/chore" /usr/local/bin/chore
          rm -rf "$unpack"
          chore --version

      # Setting the job up has no business writing into the tree the tests are about to read.
      #
      # The chore tarball carries a README.md of its own, and it used to be unpacked in the working
      # directory: every run since that step existed quietly replaced this repository's README with
      # the tool's, and nothing objected, because a clobbered file nothing asserts about is a file
      # that is fine. It was found by a test written for an entirely different reason that happened
      # to read the README, after eighteen red runs nobody could explain.
      #
      # That install is fixed. This is the class. Anything a setup step touched is either the same
      # bug again or a generated file that should be in `.gitignore` and is not.
      #
      # Here and not at the end: the benches write their reports — `sanity-report.txt` and the
      # economy one — and a guard that fails on those every time is a guard somebody switches off.
      - name: The checkout is as it was checked out
        run: |
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "setting the job up changed the checkout:" >&2
            echo "$dirty" >&2
            git diff --stat >&2
            exit 1
          fi

      # types, then the whole suite, then the bench — the same three a commit is gated on locally
      - run: chore check

      # On the run's own page as well as in the artefact, because a report you have to download and
      # unzip to read is a report nobody reads on the way past.
      - name: Show the reports
        if: always()
        run: |
          for report in collision-report.txt wire-report.txt halves-report.txt; do
            if [ -f "$report" ]; then
              {
                echo '```'
                cat "$report"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # Kept whether it passed or failed, because the run that failed is the one somebody wants to
      # read. It names the pair, the move number and the coordinates either side of it, which is
      # enough to re-run a single case without guessing at what the pipeline was doing.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benches
          path: |
            collision-report.txt
            wire-report.txt
            halves-report.txt
          if-no-files-found: warn
          retention-days: 30

  # The one that actually plays. It walks into a house, watches the world's creatures against where
  # they are drawn, chases one animal by the number the world knows it by and swings at it, walks
  # through a door both ways and looks at the furniture from inside — the faults of the day it was
  # written were all invisible to everything in the job above and obvious in thirty seconds of this.
  # Flutter owns only the interface and native renderer; the server still owns the world. This job
  # proves the narrow seam on both hosts: identical Dart parcel/rig buffers, Metal on iOS and GLES3
  # on Android. One macOS runner can compile both without pretending an iOS build works on Linux.
  flutter:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client/flutter
    steps:
      - uses: actions/checkout@v4

      # Flutter's Android template currently targets Java 17. Pinning it here prevents a runner JDK
      # upgrade from changing the Gradle toolchain under an otherwise unchanged phone client.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/renderer_smoke_test.dart
      - run: flutter build apk --debug
      - run: flutter build ios --simulator --debug

  playtest:
    runs-on: ubuntu-latest
    # A browser that hangs should cost a quarter of an hour, not the six hours a job is allowed by
    # default. The run itself is a minute and a half on a laptop.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Unpacked outside the checkout, because the tarball carries a README.md of its own. This
      # used to extract in the working directory, so every run quietly replaced THIS repository's
      # README with chore's — and nothing noticed for as long as nothing read the README. A test
      # that did reported a file full of headings like "Why not mise" and "Supported subset".
      - name: Install chore
        env:
          CHORE_VERSION: 0.10.1
        run: |
          set -euo pipefail
          unpack=$(mktemp -d)
          curl -fsSL -o "$unpack/chore.tar.gz" \
            "https://github.com/antimatter-studios/chore/releases/download/v${CHORE_VERSION}/chore-${CHORE_VERSION}-linux-x86_64.tar.gz"
          tar -xzf "$unpack/chore.tar.gz" -C "$unpack"
          sudo install -m 0755 "$unpack/chore" /usr/local/bin/chore
          rm -rf "$unpack"
          chore --version

      - name: Borrow a playwright
        env:
          PLAYWRIGHT_VERSION: 1.52.0
        run: |
          set -euo pipefail
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --global "playwright@${PLAYWRIGHT_VERSION}"
          playwright install --with-deps chrome
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      # Setting the job up has no business writing into the tree the tests are about to read.
      #
      # The chore tarball carries a README.md of its own, and it used to be unpacked in the working
      # directory: every run since that step existed quietly replaced this repository's README with
      # the tool's, and nothing objected, because a clobbered file nothing asserts about is a file
      # that is fine. It was found by a test written for an entirely different reason that happened
      # to read the README, after eighteen red runs nobody could explain.
      #
      # That install is fixed. This is the class. Anything a setup step touched is either the same
      # bug again or a generated file that should be in `.gitignore` and is not.
      #
      # Here and not at the end: the benches write their reports — `sanity-report.txt` and the
      # economy one — and a guard that fails on those every time is a guard somebody switches off.
      - name: The checkout is as it was checked out
        run: |
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "setting the job up changed the checkout:" >&2
            echo "$dirty" >&2
            git diff --stat >&2
            exit 1
          fi

      # Playwright is borrowed here exactly as it is borrowed at a desk, and stays out of
      # `package.json` on purpose. Everything that installs this project's dependencies would
      # otherwise pay for it: the Pages build, and the server image, which runs `pnpm install
      # --frozen-lockfile` once per architecture — and a browser toolchain inside a world-server
      # image is the shape of the thing that nearly killed that container. It would only
      # half-declare it in any case, because the browser is a separate download keyed by the
      # playwright version and no lockfile has ever held one. So: installed on its own, pinned, and
      # pointed at with NODE_PATH, which is the mechanism the script already expects.
      #
      # The package's own postinstall is skipped and one browser asked for by name instead. Left to
      # itself it fetches chromium, firefox and webkit — three hundred megabytes to run none of
      # them — and the one wanted is Chrome, the same one a desk run opens, so that the pipeline and
      # the desk are looking through the same renderer rather than at two different pictures.

      # No server to start and none to kill: `chore playtest` serves the page itself when nothing is
      # answering on the port and puts it away afterwards, win or lose. That is the same command a
      # person runs, which is the whole point — a pipeline nobody can reproduce is a pipeline whose
      # failures get argued about instead of fixed.
      #
      # DRIFT is looser here than the 0.35 a desk holds, and the reason is worth stating rather than
      # hiding: the drawn body is carried forward by the page between snapshots, so the gap when the
      # next one lands is partly a count of the frames the page got. A software rasteriser on two
      # shared cores gets few. The same build on one laptop read 0.11 idle, 0.46 with the cores busy
      # and 0.62 with them fought over — a measurement of the machine, not of the game.
      #
      # 1.5 rather than some number chosen to be green, because 1.5 means something: a swing reaches
      # two tiles, so a creature drawn further than that from where the world has it is one a blow
      # cannot land on however it looks, and this stays under that. It is a ceiling, not a target.
      # Every run prints what it actually got into the summary and the artefact, so once a few runs
      # have shown what this hardware really does, the line can be pulled in from evidence. Leaving
      # it at 0.35 and re-running until it went green would be worse than not running it at all.
      - name: Play the game
        env:
          DRIFT: '1.5'
        run: chore playtest

      - name: Show the report
        if: always()
        run: |
          if [ -f playtest-report.txt ]; then
            {
              echo '```'
              cat playtest-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Kept whether it passed or failed. It names the village, the animal, the number of swings and
      # how close he got, which is enough to go and stand in the same place by hand.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest
          path: playtest-report.txt
          if-no-files-found: warn
          retention-days: 30
