name: Portable mobile frame

on:
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'models/**'
      - 'properties/**'
      - 'behaviours/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tools/mobile-frame-proof/**'
      - '.github/workflows/mobile-frame-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-frame-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  portable-frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise the production frame with host ports
        run: pnpm exec vitest run src/game/frame-host.test.ts src/game/portable-frame-imports.test.ts src/render/camera-host.test.ts src/core/game-input.test.ts src/platform/browser-frame.test.ts src/game/keys.test.ts src/platform/browser-game-events.test.ts src/game/local-world-host.test.ts src/workers/simdoor.test.ts server/async-country.test.ts src/architecture.test.ts src/render/scene-state.test.ts src/render/scenegraph.test.ts src/render/scene.test.ts src/workers/chunkmesher.test.ts src/render/chunkjobs.test.ts src/render/chunkreplacement.test.ts src/render/chunkwanted.test.ts src/world/chunkpump.test.ts
      - name: Bundle and execute without browser or Node host globals
        env:
          FRAME_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FRAME_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/mobile-frame-proof/build.mjs
      - name: Compare production daylight with bare-host scene state
        env:
          SCENE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/mobile-frame-proof/scene.mjs
      - name: Compare original worker terrain with portable bare-host jobs
        env:
          CHUNK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHUNK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/mobile-frame-proof/chunks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-frame-proof
          path: mobile-frame-proof-out/
          if-no-files-found: ignore
