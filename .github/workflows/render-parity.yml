name: Renderer parity

# Run on demand after the proposed render slice is ready. The two captures use the same
# Ubuntu runner, browser, seed, camera, world time, and fixed scene setup.
#
# Or dispatch with `base` and `head` instead of `pr` to photograph every documented scene on two
# arbitrary commits, for a change that landed as several pull requests and was never compared whole.
# `base` alone compares against the tip of the ref the run was dispatched on; `head` alone is refused,
# because without a base there is nothing to compare it with.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose proposed merge is captured
        required: false
        type: number
      base_sha:
        description: Exact pull request base commit
        required: false
        type: string
      base:
        description: Any commit or ref photographed as before (with head, instead of pr)
        required: false
        type: string
      head:
        description: Any commit or ref photographed as after; its shots.cjs drives both (default, with base, is the dispatched ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  compare:
    if: (github.event_name == 'workflow_dispatch' && inputs.base == '') || github.event.label.name == 'render-parity'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Refuse a head without a base
        if: github.event_name == 'workflow_dispatch' && inputs.head != ''
        run: |
          echo "::error::head was given without base. Set base as well to compare two commits, or pass only pr."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Check out and prepare the exact PR base
        env:
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha }}
          BASE_DIR: ${{ runner.temp }}/render-base
        run: |
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          cd "$BASE_DIR"
          pnpm install --frozen-lockfile

      - name: Capture fixed scenes on the base
        env:
          BASE_DIR: ${{ runner.temp }}/render-base
          OUT: ${{ runner.temp }}/render-before
          RIG: classic
          PATIENCE: '120000'
        run: |
          mkdir -p "$OUT"
          cd "$BASE_DIR"
          PORT=5187 STATIC_SCENE=1 node tools/shots.cjs town mountain
          PORT=5187 node tools/shots.cjs interior

      - name: Capture the proposed merge on the same runner
        env:
          OUT: ${{ runner.temp }}/render-after
          RIG: classic
          PATIENCE: '120000'
        run: |
          mkdir -p "$OUT"
          PORT=5188 STATIC_SCENE=1 node tools/shots.cjs town mountain
          PORT=5188 node tools/shots.cjs interior

      - name: Compare fixed scenery at the strict pixel threshold
        env:
          OUT: ${{ runner.temp }}/render-after
          BEFORE: ${{ runner.temp }}/render-before
          REPORTS: ${{ runner.temp }}
          EXCLUDE_RECT: 1103,0,1440,900
        run: |
          # The right HUD column contains the live clock, messages, bars and async minimap.
          # Compare every pixel of the fixed world area at the unchanged 0.50% threshold.
          set +e
          SHOTS="$OUT" node tools/compare.cjs "$BEFORE" town.png mountain.png
          outdoor=$?
          cp docs/reports/pictures-report.txt "$REPORTS/render-outdoor-report.txt"
          SHOTS="$OUT" node tools/compare.cjs "$BEFORE" interior.png
          interior=$?
          cp docs/reports/pictures-report.txt "$REPORTS/render-interior-report.txt"
          test "$outdoor" -eq 0 && test "$interior" -eq 0

      - name: Keep both captures and the pixel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-parity
          path: |
            ${{ runner.temp }}/render-before/*.png
            ${{ runner.temp }}/render-after/*.png
            ${{ runner.temp }}/render-*-report.txt
          if-no-files-found: warn
          retention-days: 30

  # Both trees are photographed by the head's shots.cjs, with the reference-capture job's settings,
  # so a difference is in the game rather than in how it was driven. The base must already answer
  # the capture probes that script asks for; anything before #452 has to have them ported first.
  capture:
    if: github.event_name == 'workflow_dispatch' && inputs.base != ''
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Check out and prepare the ${{ matrix.side }} commit
        env:
          REF: ${{ matrix.side == 'base' && inputs.base || inputs.head || github.sha }}
          TREE: ${{ runner.temp }}/render-tree
        run: |
          git fetch --no-tags origin "$REF"
          git worktree add --detach "$TREE" FETCH_HEAD
          cd "$TREE"
          git log -1 --format='photographing %H %s'
          pnpm install --frozen-lockfile

      - name: Photograph every documented scene
        env:
          TREE: ${{ runner.temp }}/render-tree
          OUT: ${{ runner.temp }}/render-${{ matrix.side }}
          PORT: '5185'
        run: |
          set -uo pipefail
          mkdir -p "$OUT"
          cd "$TREE"
          node "$GITHUB_WORKSPACE/tools/shots.cjs" 2>&1 | tee "$OUT/capture.log"
          exit "${PIPESTATUS[0]}"

      - name: Keep this side's captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ matrix.side }}
          path: ${{ runner.temp }}/render-${{ matrix.side }}/
          if-no-files-found: warn
          retention-days: 30

  compare-commits:
    needs: capture
    if: always() && github.event_name == 'workflow_dispatch' && inputs.base != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: render-base
          path: ${{ runner.temp }}/render-base

      - uses: actions/download-artifact@v4
        with:
          name: render-head
          path: ${{ runner.temp }}/render-head

      - name: Compare every documented scene at the strict pixel threshold
        env:
          BEFORE: ${{ runner.temp }}/render-base
          OUT: ${{ runner.temp }}/render-parity
        run: |
          # No excluded rectangle: every pixel of every scene, at the unchanged 0.50% threshold.
          set +e
          mkdir -p "$OUT"
          mapfile -t scenes < <(node tools/shots.cjs --list | awk '{print $1 ".png"}')
          SHOTS="$RUNNER_TEMP/render-head" DIFF_OUT="$OUT/diff" node tools/compare.cjs "$BEFORE" "${scenes[@]}" > "$OUT/render-commits-report.txt" 2>&1
          compared=$?
          cat "$OUT/render-commits-report.txt"
          # compare.cjs names only the scenes past the threshold; say how far every one moved.
          for scene in "${scenes[@]}"; do
            share=$(SHOTS="$RUNNER_TEMP/render-head" node tools/compare.cjs "$BEFORE" "$scene" 2>&1 | grep -o 'worst [0-9.]*%\|missing.*')
            echo "$scene ${share:-no result}"
          done | tee "$OUT/render-commits-scenes.txt"
          test "${{ needs.capture.result }}" = success && test "$compared" -eq 0

      - name: Keep the diff and the pixel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-parity-commits
          path: ${{ runner.temp }}/render-parity/
          if-no-files-found: warn
          retention-days: 30
