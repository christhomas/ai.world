<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Wars - 3D Isometric World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; overflow: hidden; font-family: 'Courier New', monospace; }
        #gameContainer { width: 100vw; height: 100vh; }
        #dialogBox {
            display: none; position: fixed;
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            border: 4px solid #6c5ce7; border-radius: 12px; padding: 20px;
            color: #fff; min-width: 280px; max-width: 350px;
            box-shadow: 0 0 30px rgba(108, 92, 231, 0.5); z-index: 1000;
        }
        #dialogBox.show { display: block; animation: popIn 0.3s ease-out; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        #dialogBox h3 { color: #a29bfe; margin-bottom: 10px; font-size: 18px; }
        #dialogBox p { line-height: 1.6; font-size: 14px; }
        #dialogBox .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; color: #a29bfe; font-size: 20px; }
        #boundaryWarning {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 107, 107, 0.9); border: 3px solid #ee5a5a;
            border-radius: 10px; padding: 20px 40px; color: #fff;
            font-size: 18px; font-weight: bold; z-index: 1001;
        }
        #controls {
            position: fixed; bottom: 20px; left: 20px;
            background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px;
            color: #fff; font-size: 12px; z-index: 100;
        }
        #controls h4 { color: #a29bfe; margin-bottom: 8px; }
        #areaName {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); border: 2px solid #6c5ce7;
            border-radius: 8px; padding: 10px 30px; color: #a29bfe;
            font-size: 16px; font-weight: bold; z-index: 100;
        }
        #minimap {
            position: fixed; top: 20px; right: 20px;
            background: rgba(0,0,0,0.8); border: 2px solid #6c5ce7;
            border-radius: 8px; padding: 5px; z-index: 100;
        }
        #minimapCanvas { display: block; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #a29bfe; font-size: 24px; z-index: 2000; }
        #optionsPanel {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); border: 2px solid #6c5ce7;
            border-radius: 12px; padding: 20px; min-width: 300px;
            color: #fff; z-index: 1500;
        }
        #optionsPanel.show { display: block; animation: popIn 0.3s ease-out; }
        #optionsPanel h3 { color: #a29bfe; margin-bottom: 15px; text-align: center; }
        #optionsPanel .slider-group { margin-bottom: 15px; }
        #optionsPanel label { display: block; margin-bottom: 5px; color: #ccc; }
        #optionsPanel input[type="range"] { width: 100%; cursor: pointer; }
        #optionsPanel .value-display { text-align: right; color: #a29bfe; font-size: 14px; margin-top: 3px; }
        #optionsPanel .close-hint { text-align: center; color: #666; font-size: 11px; margin-top: 15px; }
    </style>
</head>
<body>
    <div id="loading">Generating World...</div>
    <div id="gameContainer"></div>
    <div id="areaName">The Central Hub</div>
    <div id="minimap"><canvas id="minimapCanvas" width="180" height="180"></canvas></div>
    <div id="dialogBox">
        <span class="close-btn" onclick="closeDialog()">&times;</span>
        <h3 id="dialogTitle">Entity</h3>
        <p id="dialogText">...</p>
    </div>
    <div id="boundaryWarning">⚠️ Uh oh! There's no world here yet!</div>
    <div id="controls">
        <h4>🎮 Controls</h4>
        <div>WASD - Move Camera</div>
        <div>Mouse Drag - Pan Camera</div>
        <div>Q/E - Rotate Camera</div>
        <div>Scroll - Zoom</div>
        <div>Click - Interact</div>
        <div>O - Options</div>
    </div>
    <div id="optionsPanel">
        <h3>Options</h3>
        <div class="slider-group">
            <label>Sunlight Intensity</label>
            <input type="range" id="sunlightSlider" min="0" max="20" step="0.1" value="12">
            <div class="value-display" id="sunlightValue">12</div>
        </div>
        <div class="slider-group">
            <label>Hemisphere Light Intensity</label>
            <input type="range" id="hemisphereSlider" min="0" max="2" step="0.05" value="0.75">
            <div class="value-display" id="hemisphereValue">0.75</div>
        </div>
        <div class="close-hint">Press ESC or O to close</div>
    </div>

    <script src="https://unpkg.com/three@0.157.0/build/three.min.js"></script>
    <script>
        if (typeof THREE === 'undefined') {
            document.getElementById('loading').textContent = 'Error: Failed to load Three.js';
            throw new Error('Three.js not loaded');
        }

        // ============================================
        // CONFIGURATION
        // ============================================
        // Go crazy with these settings!
        const CONFIG = {
            CHUNK_SIZE: 8,          // Tiles per chunk
            TILE_SIZE: 2,           // World units per tile
            CAMERA_SPEED: 0.4,
            NUM_TENTACLES: 15,      // Number of main tentacles from hub
            TENTACLE_LENGTH: 10,    // How far tentacles extend
            BRANCH_CHANCE: 0.25,    // Chance of branching off tentacles
            LOOP_CHANCE: 0.15,      // Chance of creating loops
            MAX_BRANCH_DEPTH: 3,    // How deep branches can nest
            MAX_CHUNKS: 300         // Safety limit (increase for bigger worlds!)
        };

        // ============================================
        // THREE.JS SETUP
        // ============================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a15);
        scene.fog = new THREE.Fog(0x0a0a15, 50, 120);

        let frustumSize = 28;
        const aspect = window.innerWidth / window.innerHeight;
        const camera = new THREE.OrthographicCamera(
            -frustumSize * aspect / 2, frustumSize * aspect / 2,
            frustumSize / 2, -frustumSize / 2, 0.1, 1000
        );

        let cameraRotation = Math.PI / 4;
        const cameraHeight = 50;
        const cameraDistance = 50;
        const cameraTarget = new THREE.Vector3(0, 0, 0);

        function updateCameraPosition() {
            camera.position.x = cameraTarget.x + Math.cos(cameraRotation) * cameraDistance;
            camera.position.z = cameraTarget.z + Math.sin(cameraRotation) * cameraDistance;
            camera.position.y = cameraHeight;
            camera.lookAt(cameraTarget);
        }
        updateCameraPosition();

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('gameContainer').appendChild(renderer.domElement);

        // Lighting
        scene.add(new THREE.AmbientLight(0x6688cc, 0.75));
        const sunLight = new THREE.DirectionalLight(0xffffee, 12);
        sunLight.position.set(50, 80, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.camera.left = -80;
        sunLight.shadow.camera.right = 80;
        sunLight.shadow.camera.top = 80;
        sunLight.shadow.camera.bottom = -80;
        scene.add(sunLight);
        const hemisphereLight = new THREE.HemisphereLight(0x88aaff, 0x445522, 0.75);
        scene.add(hemisphereLight);

        // ============================================
        // MATERIALS (shared across all meshes)
        // ============================================
        const materials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x4a7c3f }),
            grassDark: new THREE.MeshLambertMaterial({ color: 0x3d6b34 }),
            grassLight: new THREE.MeshLambertMaterial({ color: 0x5a9c4f }),
            dirt: new THREE.MeshLambertMaterial({ color: 0x8b7355 }),
            path: new THREE.MeshLambertMaterial({ color: 0xa08060 }),
            stone: new THREE.MeshLambertMaterial({ color: 0x777777 }),
            water: new THREE.MeshLambertMaterial({ color: 0x3498db, transparent: true, opacity: 0.7 }),
            treeTrunk: new THREE.MeshLambertMaterial({ color: 0x654321 }),
            treeLeaves: new THREE.MeshLambertMaterial({ color: 0x2d8a2e }),
            pineLeaves: new THREE.MeshLambertMaterial({ color: 0x1a5a1f }),
            rock: new THREE.MeshLambertMaterial({ color: 0x666666 }),
            void: new THREE.MeshLambertMaterial({ color: 0x15152a }),
            boundary: new THREE.MeshLambertMaterial({ color: 0x6c5ce7, transparent: true, opacity: 0.6, emissive: 0x3c2ca7, emissiveIntensity: 0.3 })
        };

        // ============================================
        // GEOMETRY CACHE (reuse geometries to save memory)
        // ============================================
        const geometryCache = new Map();

        function getCachedGeometry(type, ...args) {
            const key = `${type}_${args.join('_')}`;
            if (!geometryCache.has(key)) {
                let geo;
                switch (type) {
                    case 'box':
                        geo = new THREE.BoxGeometry(...args);
                        break;
                    case 'sphere':
                        geo = new THREE.SphereGeometry(...args);
                        break;
                    case 'cylinder':
                        geo = new THREE.CylinderGeometry(...args);
                        break;
                    case 'cone':
                        geo = new THREE.ConeGeometry(...args);
                        break;
                    case 'dodecahedron':
                        geo = new THREE.DodecahedronGeometry(...args);
                        break;
                    default:
                        throw new Error(`Unknown geometry type: ${type}`);
                }
                geometryCache.set(key, geo);
            }
            return geometryCache.get(key);
        }

        // Cleanup function for Three.js objects
        function disposeObject(obj) {
            if (!obj) return;

            // Recursively dispose children
            if (obj.children) {
                while (obj.children.length > 0) {
                    disposeObject(obj.children[0]);
                    obj.remove(obj.children[0]);
                }
            }

            // Dispose geometry (only if not cached)
            if (obj.geometry && !geometryCache.has(obj.geometry)) {
                obj.geometry.dispose();
            }

            // Note: We don't dispose materials since they're shared
        }

        // ============================================
        // OCTOPUS WORLD GENERATION
        // ============================================
        const chunks = new Map();  // Key: "x,z" -> chunk data
        const chunkMeshes = new Map();  // Key: "x,z" -> THREE.Group
        const DIRECTIONS = [
            { x: 1, z: 0, name: 'east' },
            { x: -1, z: 0, name: 'west' },
            { x: 0, z: 1, name: 'south' },
            { x: 0, z: -1, name: 'north' },
            { x: 1, z: 1, name: 'southeast' },
            { x: -1, z: 1, name: 'southwest' },
            { x: 1, z: -1, name: 'northeast' },
            { x: -1, z: -1, name: 'northwest' }
        ];

        const areaNames = {
            hub: ['The Central Hub', 'The Nexus', 'Origin Point', 'The Heartland'],
            tentacle: ['Winding Path', 'The Long Road', 'Serpent\'s Trail', 'Ancient Way', 'Mystic Corridor'],
            branch: ['Hidden Grove', 'Secret Dell', 'Shadowed Hollow', 'Quiet Meadow', 'Forgotten Glade'],
            end: ['World\'s Edge', 'The Far Reach', 'Distant Shore', 'Frontier\'s End', 'The Boundary']
        };

        // Noise for terrain variation
        class SimpleNoise {
            constructor(seed = 12345) {
                this.seed = seed;
            }
            noise2D(x, y) {
                const n = Math.sin(x * 12.9898 + y * 78.233 + this.seed) * 43758.5453;
                return (n - Math.floor(n)) * 2 - 1;
            }
            octave(x, y, octaves = 4) {
                let val = 0, amp = 1, freq = 1, max = 0;
                for (let i = 0; i < octaves; i++) {
                    val += this.noise2D(x * freq, y * freq) * amp;
                    max += amp;
                    amp *= 0.5;
                    freq *= 2;
                }
                return val / max;
            }
        }
        const noise = new SimpleNoise(42);

        function generateOctopusWorld() {
            console.log('Creating central hub...');
            // Create central hub (larger area)
            createChunk(0, 0, 'hub');
            createChunk(1, 0, 'hub');
            createChunk(-1, 0, 'hub');
            createChunk(0, 1, 'hub');
            createChunk(0, -1, 'hub');
            console.log('Central hub created, chunks:', chunks.size);

            // Create tentacles spreading out
            console.log('Creating', CONFIG.NUM_TENTACLES, 'tentacles...');
            const usedDirs = [];
            for (let t = 0; t < CONFIG.NUM_TENTACLES; t++) {
                console.log('Starting tentacle', t + 1, '/', CONFIG.NUM_TENTACLES);
                // Pick a direction not too close to existing ones
                let dir;
                let attempts = 0;
                do {
                    dir = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];
                    attempts++;
                } while (usedDirs.some(d => d.x === dir.x && d.z === dir.z) && attempts < 20);
                usedDirs.push(dir);

                growTentacle(dir.x * 2, dir.z * 2, dir, CONFIG.TENTACLE_LENGTH, 0);
                console.log('Tentacle', t + 1, 'completed, chunks:', chunks.size);
            }

            // Try to create some loops by connecting nearby endpoints
            console.log('Creating loops...');
            createLoops();
            console.log('World generation complete, total chunks:', chunks.size);
        }

        function growTentacle(startX, startZ, direction, length, depth) {
            // Stop if we've hit the chunk limit or max recursion depth
            if (chunks.size >= CONFIG.MAX_CHUNKS || depth > CONFIG.MAX_BRANCH_DEPTH) return;

            let x = startX;
            let z = startZ;
            let dir = { ...direction };

            for (let i = 0; i < length; i++) {
                // Stop if we've hit the chunk limit
                if (chunks.size >= CONFIG.MAX_CHUNKS) return;

                // Create chunk if it doesn't exist
                if (!chunks.has(`${x},${z}`)) {
                    const type = i === length - 1 ? 'end' : 'tentacle';
                    if (!createChunk(x, z, type)) return; // Hit limit

                    // Maybe branch - with additional safety checks
                    if (depth < CONFIG.MAX_BRANCH_DEPTH && 
                        Math.random() < CONFIG.BRANCH_CHANCE && 
                        i > 1 && 
                        i < length - 2 &&
                        chunks.size < CONFIG.MAX_CHUNKS - 10) { // Leave room for branches
                        const branchDir = getPerpendicularDirection(dir);
                        const branchLength = Math.max(2, Math.min(6, Math.floor(length * 0.5))); // Limit branch length
                        growTentacle(x + branchDir.x, z + branchDir.z, branchDir, branchLength, depth + 1);
                    }
                }

                // Move in direction with some meandering
                if (Math.random() < 0.3) {
                    const turnDirs = DIRECTIONS.filter(d =>
                        d.x !== -dir.x || d.z !== -dir.z
                    );
                    if (turnDirs.length > 0) {
                        dir = turnDirs[Math.floor(Math.random() * turnDirs.length)];
                    }
                }

                x += dir.x;
                z += dir.z;

                // Safety: break if we're going too far
                if (Math.abs(x - startX) > CONFIG.TENTACLE_LENGTH * 2 || 
                    Math.abs(z - startZ) > CONFIG.TENTACLE_LENGTH * 2) {
                    break;
                }
            }
        }

        function getPerpendicularDirection(dir) {
            const perps = DIRECTIONS.filter(d =>
                (d.x !== dir.x || d.z !== dir.z) &&
                (d.x !== -dir.x || d.z !== -dir.z)
            );
            return perps[Math.floor(Math.random() * perps.length)];
        }

        function createLoops() {
            // Find chunks that are close but not connected and connect them
            const chunkList = Array.from(chunks.keys()).map(k => {
                const [x, z] = k.split(',').map(Number);
                return { x, z, key: k };
            });

            const maxLoops = Math.min(20, chunkList.length); // Limit loops to prevent issues
            let loopsCreated = 0;

            for (const chunk of chunkList) {
                if (loopsCreated >= maxLoops || chunks.size >= CONFIG.MAX_CHUNKS) break;
                
                for (const dir of DIRECTIONS) {
                    if (loopsCreated >= maxLoops || chunks.size >= CONFIG.MAX_CHUNKS) break;
                    
                    const nx = chunk.x + dir.x;
                    const nz = chunk.z + dir.z;
                    const neighborKey = `${nx},${nz}`;

                    // If neighbor exists but there's a gap, maybe fill it
                    if (!chunks.has(neighborKey)) {
                        // Check if there's a chunk 2 steps away
                        const farKey = `${chunk.x + dir.x * 2},${chunk.z + dir.z * 2}`;
                        if (chunks.has(farKey) && Math.random() < CONFIG.LOOP_CHANCE) {
                            if (createChunk(nx, nz, 'branch')) {
                                loopsCreated++;
                            }
                        }
                    }
                }
            }
        }

        function createChunk(chunkX, chunkZ, type = 'tentacle') {
            const key = `${chunkX},${chunkZ}`;
            if (chunks.has(key)) return false;

            // Safety limit
            if (chunks.size >= CONFIG.MAX_CHUNKS) {
                return false;
            }

            const nameList = areaNames[type] || areaNames.tentacle;
            const chunk = {
                x: chunkX,
                z: chunkZ,
                type: type,
                name: nameList[Math.floor(Math.random() * nameList.length)],
                tiles: []
            };

            // Generate tiles for this chunk
            const worldOffsetX = chunkX * CONFIG.CHUNK_SIZE;
            const worldOffsetZ = chunkZ * CONFIG.CHUNK_SIZE;

            for (let tz = 0; tz < CONFIG.CHUNK_SIZE; tz++) {
                chunk.tiles[tz] = [];
                for (let tx = 0; tx < CONFIG.CHUNK_SIZE; tx++) {
                    const worldX = worldOffsetX + tx;
                    const worldZ = worldOffsetZ + tz;

                    const n = noise.octave(worldX * 0.1, worldZ * 0.1, 4);
                    const elevation = Math.max(0, Math.floor((n + 1) * 1.5));

                    let terrain = 'grass';
                    const terrainNoise = noise.noise2D(worldX * 0.2, worldZ * 0.2);

                    // Path in center of chunks
                    const distFromCenter = Math.abs(tx - CONFIG.CHUNK_SIZE/2) + Math.abs(tz - CONFIG.CHUNK_SIZE/2);
                    if (distFromCenter < 2) {
                        terrain = 'path';
                    } else if (terrainNoise > 0.4) {
                        terrain = Math.random() < 0.3 ? 'tree' : 'grassDark';
                    } else if (terrainNoise < -0.4) {
                        terrain = Math.random() < 0.2 ? 'rock' : 'stone';
                    } else if (elevation === 0 && terrainNoise < -0.2) {
                        terrain = 'water';
                    } else {
                        terrain = Math.random() < 0.3 ? 'grassLight' : 'grass';
                    }

                    // Check if this is an edge tile
                    const isEdge = tx === 0 || tx === CONFIG.CHUNK_SIZE - 1 ||
                                   tz === 0 || tz === CONFIG.CHUNK_SIZE - 1;

                    chunk.tiles[tz][tx] = {
                        terrain,
                        elevation,
                        isPassable: !['tree', 'rock', 'water'].includes(terrain),
                        isEdge
                    };
                }
            }

            chunks.set(key, chunk);
            buildChunkMesh(chunk);
            return true;
        }

        function buildChunkMesh(chunk) {
            const group = new THREE.Group();
            const worldOffsetX = chunk.x * CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE;
            const worldOffsetZ = chunk.z * CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE;

            // Cache geometries for common tile heights
            const tileGeoCache = new Map();
            function getTileGeo(height) {
                const key = height.toFixed(2);
                if (!tileGeoCache.has(key)) {
                    tileGeoCache.set(key, getCachedGeometry('box', CONFIG.TILE_SIZE, height, CONFIG.TILE_SIZE));
                }
                return tileGeoCache.get(key);
            }

            for (let tz = 0; tz < CONFIG.CHUNK_SIZE; tz++) {
                for (let tx = 0; tx < CONFIG.CHUNK_SIZE; tx++) {
                    const tile = chunk.tiles[tz][tx];
                    const x = worldOffsetX + tx * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
                    const z = worldOffsetZ + tz * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
                    const height = tile.elevation * 0.3 + 0.15;

                    // Check if edge leads to void
                    let isVoidEdge = false;
                    if (tile.isEdge) {
                        const neighborChunkX = chunk.x + (tx === 0 ? -1 : tx === CONFIG.CHUNK_SIZE - 1 ? 1 : 0);
                        const neighborChunkZ = chunk.z + (tz === 0 ? -1 : tz === CONFIG.CHUNK_SIZE - 1 ? 1 : 0);
                        if (!chunks.has(`${neighborChunkX},${neighborChunkZ}`)) {
                            isVoidEdge = true;
                        }
                    }

                    // Ground tile
                    let mat = materials[tile.terrain] || materials.grass;
                    if (isVoidEdge) {
                        mat = materials.boundary;
                    }

                    const geo = getTileGeo(height);
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(x, height / 2, z);
                    mesh.receiveShadow = true;
                    mesh.userData = { chunkKey: `${chunk.x},${chunk.z}`, tileX: tx, tileZ: tz, isVoidEdge };
                    group.add(mesh);

                    // Add features
                    if (tile.terrain === 'tree') {
                        addTree(group, x, height, z);
                    } else if (tile.terrain === 'rock') {
                        addRock(group, x, height, z);
                    }
                }
            }

            group.position.set(0, 0, 0);
            scene.add(group);
            chunkMeshes.set(`${chunk.x},${chunk.z}`, group);
        }

        function addTree(group, x, y, z) {
            const trunk = new THREE.Mesh(
                getCachedGeometry('cylinder', 0.12, 0.18, 1.2, 6),
                materials.treeTrunk
            );
            trunk.position.set(x, y + 0.6, z);
            trunk.castShadow = true;
            group.add(trunk);

            const leaves = new THREE.Mesh(
                getCachedGeometry('sphere', 0.7, 8, 6),
                materials.treeLeaves
            );
            leaves.position.set(x, y + 1.5, z);
            leaves.castShadow = true;
            group.add(leaves);
        }

        function addRock(group, x, y, z) {
            const rock = new THREE.Mesh(
                getCachedGeometry('dodecahedron', 0.4, 0),
                materials.rock
            );
            rock.position.set(x, y + 0.25, z);
            rock.rotation.set(Math.random(), Math.random(), Math.random());
            rock.scale.set(1, 0.6, 1);
            rock.castShadow = true;
            group.add(rock);
        }

        // ============================================
        // VOID PLANE (for areas with no chunks)
        // ============================================
        const voidPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(500, 500),
            new THREE.MeshLambertMaterial({ color: 0x0a0a15 })
        );
        voidPlane.rotation.x = -Math.PI / 2;
        voidPlane.position.y = -0.5;
        scene.add(voidPlane);

        // ============================================
        // 3D ENTITY MODELS
        // ============================================
        const entities = [];

        // Cache for entity materials to avoid creating duplicates
        const entityMaterialCache = new Map();
        function getEntityMaterial(color) {
            const key = color.toString(16);
            if (!entityMaterialCache.has(key)) {
                entityMaterialCache.set(key, new THREE.MeshLambertMaterial({ color }));
            }
            return entityMaterialCache.get(key);
        }

        function createHumanModel(skinColor, hairColor, shirtColor, pantsColor) {
            const group = new THREE.Group();
            const skin = getEntityMaterial(skinColor);
            const hair = getEntityMaterial(hairColor);
            const shirt = getEntityMaterial(shirtColor);
            const pants = getEntityMaterial(pantsColor);
            const shoe = getEntityMaterial(0x333333);
            const eyeMat = getEntityMaterial(0x222222);

            // Head
            const head = new THREE.Mesh(getCachedGeometry('box', 0.3, 0.35, 0.3), skin);
            head.position.set(0, 1.35, 0);
            head.castShadow = true;
            group.add(head);
            // Hair
            const hairMesh = new THREE.Mesh(getCachedGeometry('box', 0.34, 0.2, 0.34), hair);
            hairMesh.position.set(0, 1.5, 0);
            group.add(hairMesh);
            // Eyes
            const leftEye = new THREE.Mesh(getCachedGeometry('box', 0.06, 0.06, 0.04), eyeMat);
            leftEye.position.set(-0.07, 1.37, 0.15);

        // ============================================
        // ENTITY CLASS
        // ============================================
        const dialogues = {
            cow: ["Moooo~", "Got hay?", "*chews cud*", "Mooo!"],
            chicken: ["Bawk!", "*pecks*", "Cluck~", "BUG!"],
            cat: ["*stares*", "Meow.", "*blink*", "Purrr~"],
            dog: ["WOOF!", "*wag wag*", "Ball?!", "*pant*"],
            human: ["Hello!", "*waves*", "Nice day!", "Hi there~"]
        };

        class Entity3D {
            constructor(x, z, type, model) {
                this.model = model;
                this.type = type;
                this.x = x;
                this.z = z;
                this.targetX = x;
                this.targetZ = z;
                this.moveTimer = Math.random() * 3000;
                this.animTime = Math.random() * 100;
                this.isMoving = false;

                const names = {
                    cow: ['Bessie', 'Daisy', 'Moo'],
                    chicken: ['Nugget', 'Clucky', 'Pecky'],
                    cat: ['Whiskers', 'Shadow', 'Luna'],
                    dog: ['Buddy', 'Max', 'Rex'],
                    human: ['Alex', 'Nova', 'Kai', 'Zeph']
                };
                this.name = names[type][Math.floor(Math.random() * names[type].length)];

                this.updatePosition();
                scene.add(this.model);
            }

            getElevationAt(x, z) {
                const chunkX = Math.floor(x / (CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE));
                const chunkZ = Math.floor(z / (CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE));
                const chunk = chunks.get(`${chunkX},${chunkZ}`);
                if (!chunk) return 0;

                const localX = Math.floor((x - chunkX * CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE) / CONFIG.TILE_SIZE);
                const localZ = Math.floor((z - chunkZ * CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE) / CONFIG.TILE_SIZE);

                if (localX >= 0 && localX < CONFIG.CHUNK_SIZE && localZ >= 0 && localZ < CONFIG.CHUNK_SIZE) {
                    return chunk.tiles[localZ][localX].elevation * 0.3 + 0.15;
                }
                return 0;
            }

            isPassableAt(x, z) {
                const chunkX = Math.floor(x / (CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE));
                const chunkZ = Math.floor(z / (CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE));
                const chunk = chunks.get(`${chunkX},${chunkZ}`);
                if (!chunk) return false;

                const localX = Math.floor((x - chunkX * CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE) / CONFIG.TILE_SIZE);
                const localZ = Math.floor((z - chunkZ * CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE) / CONFIG.TILE_SIZE);

                if (localX >= 0 && localX < CONFIG.CHUNK_SIZE && localZ >= 0 && localZ < CONFIG.CHUNK_SIZE) {
                    return chunk.tiles[localZ][localX].isPassable;
                }
                return false;
            }

            updatePosition() {
                const elevation = this.getElevationAt(this.x, this.z);
                this.model.position.set(this.x, elevation, this.z);
            }

            update(deltaTime) {
                this.moveTimer -= deltaTime;
                this.animTime += deltaTime;

                if (this.moveTimer <= 0) {
                    this.moveTimer = 2000 + Math.random() * 4000;

                    for (let attempts = 0; attempts < 15; attempts++) {
                        const range = this.type === 'chicken' ? 5 : 3;
                        const newX = this.x + (Math.random() - 0.5) * range;
                        const newZ = this.z + (Math.random() - 0.5) * range;

                        if (this.isPassableAt(newX, newZ)) {
                            this.targetX = newX;
                            this.targetZ = newZ;
                            break;
                        }
                    }
                }

                const dx = this.targetX - this.x;
                const dz = this.targetZ - this.z;
                const dist = Math.sqrt(dx * dx + dz * dz);

                const speed = { cow: 0.012, chicken: 0.02, cat: 0.015, dog: 0.025, human: 0.015 }[this.type] || 0.015;

                if (dist > 0.08) {
                    this.x += dx * speed;
                    this.z += dz * speed;
                    this.isMoving = true;
                    this.model.rotation.y = Math.atan2(dx, dz) - Math.PI / 2;
                } else {
                    this.isMoving = false;
                }

                this.updatePosition();
                this.animate();
            }

            animate() {
                const walkCycle = this.isMoving ? Math.sin(this.animTime * 0.012) * 0.35 : 0;
                this.model.children.forEach(child => {
                    if (child.name.includes('Left')) child.rotation.x = walkCycle;
                    if (child.name.includes('Right')) child.rotation.x = -walkCycle;
                    if (child.name === 'tail') child.rotation.z = Math.PI / 4 + Math.sin(this.animTime * 0.015) * 0.3;
                    if (child.name === 'leftArm') child.rotation.x = -walkCycle;
                    if (child.name === 'rightArm') child.rotation.x = walkCycle;
                });
                if (this.isMoving) this.model.position.y += Math.abs(Math.sin(this.animTime * 0.012)) * 0.015;
            }

            getDialogue() {
                return dialogues[this.type][Math.floor(Math.random() * dialogues[this.type].length)];
            }
        }

        // ============================================
        // SPAWN ENTITIES
        // ============================================
        function spawnEntities() {
            const spawnPoints = [];

            chunks.forEach((chunk, key) => {
                const [cx, cz] = key.split(',').map(Number);
                const worldX = cx * CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE;
                const worldZ = cz * CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE;

                for (let tz = 1; tz < CONFIG.CHUNK_SIZE - 1; tz++) {
                    for (let tx = 1; tx < CONFIG.CHUNK_SIZE - 1; tx++) {
                        if (chunk.tiles[tz][tx].isPassable) {
                            spawnPoints.push({
                                x: worldX + tx * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2,
                                z: worldZ + tz * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2
                            });
                        }
                    }
                }
            });

            const getRandom = () => spawnPoints[Math.floor(Math.random() * spawnPoints.length)];

            // Scale entities with world size - more chunks = more creatures!
            const numChunks = chunks.size;
            const scaleFactor = Math.max(1, numChunks / 10);

            // Spawn creatures - scales with world size
            const numCows = Math.floor(6 * scaleFactor);
            const numChickens = Math.floor(12 * scaleFactor);
            const numCats = Math.floor(5 * scaleFactor);
            const numDogs = Math.floor(5 * scaleFactor);
            const numHumans = Math.floor(10 * scaleFactor);

            console.log(`Spawning: ${numCows} cows, ${numChickens} chickens, ${numCats} cats, ${numDogs} dogs, ${numHumans} humans`);

            for (let i = 0; i < numCows; i++) {
                const p = getRandom();
                if (p) entities.push(new Entity3D(p.x, p.z, 'cow', createCowModel()));
            }
            for (let i = 0; i < numChickens; i++) {
                const p = getRandom();
                if (p) entities.push(new Entity3D(p.x, p.z, 'chicken', createChickenModel()));
            }
            const catColors = [0xff9900, 0x888888, 0x333333, 0xeeeeee, 0xddaa77, 0x666666];
            for (let i = 0; i < numCats; i++) {
                const p = getRandom();
                if (p) entities.push(new Entity3D(p.x, p.z, 'cat', createCatModel(catColors[i % catColors.length])));
            }
            const dogColors = [0x964B00, 0xDAA520, 0x444444, 0xcccccc, 0x8B4513, 0xffd700];
            for (let i = 0; i < numDogs; i++) {
                const p = getRandom();
                if (p) entities.push(new Entity3D(p.x, p.z, 'dog', createDogModel(dogColors[i % dogColors.length])));
            }
            // Humans with anime hair - lots of variety!
            const hairColors = [0x2c1810, 0x8B4513, 0xFFD700, 0xFF6B6B, 0x6c5ce7, 0x00CED1, 0xFF69B4, 0x00FF7F, 0xFF4500, 0x9400D3, 0x00FFFF, 0xff0000, 0x0000ff];
            const skinColors = [0xFFDAB9, 0xDEB887, 0xD2691E, 0xFFE4C4, 0x8B4513, 0xFFE0BD];
            const shirtColors = [0xe74c3c, 0x3498db, 0x2ecc71, 0x9b59b6, 0xff69b4, 0xf39c12, 0x1abc9c, 0xe91e63, 0x00bcd4, 0x673ab7];
            const pantsColors = [0x334466, 0x2c3e50, 0x1a1a2e, 0x4a4a6a, 0x2d2d44];
            for (let i = 0; i < numHumans; i++) {
                const p = getRandom();
                if (p) entities.push(new Entity3D(p.x, p.z, 'human', createHumanModel(
                    skinColors[Math.floor(Math.random() * skinColors.length)],
                    hairColors[Math.floor(Math.random() * hairColors.length)],
                    shirtColors[Math.floor(Math.random() * shirtColors.length)],
                    pantsColors[Math.floor(Math.random() * pantsColors.length)]
                )));
            }
        }

        // ============================================
        // GENERATE WORLD
        // ============================================
        console.log('Starting world generation...');
        const startTime = performance.now();
        
        // Add timeout protection
        const generationTimeout = setTimeout(() => {
            console.error('World generation timed out - forcing completion');
            document.getElementById('loading').textContent = 'Generation took too long - loading incomplete world';
        }, 10000); // 10 second timeout
        
        try {
            generateOctopusWorld();
            console.log('World generation completed in', Math.round(performance.now() - startTime), 'ms');
            spawnEntities();
            console.log('Entity spawning completed in', Math.round(performance.now() - startTime), 'ms');
        } catch (error) {
            console.error('Error during world generation:', error);
            document.getElementById('loading').textContent = 'Error generating world';
        }
        
        clearTimeout(generationTimeout);

        // ============================================
        // INPUT & INTERACTION
        // ============================================
        const keys = {};
        document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Mouse drag state
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let dragMoved = false;
        const DRAG_THRESHOLD = 5; // Pixels moved before considered a drag
        const DRAG_SPEED = 0.05; // How fast dragging moves the camera

        renderer.domElement.addEventListener('mousedown', (e) => {
            if (e.button === 0) { // Left mouse button
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                dragMoved = false;
                renderer.domElement.style.cursor = 'grabbing';
            }
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - dragStartX;
                const deltaY = e.clientY - dragStartY;

                // Check if we've moved enough to be considered a drag
                if (Math.abs(deltaX) > DRAG_THRESHOLD || Math.abs(deltaY) > DRAG_THRESHOLD) {
                    dragMoved = true;
                }

                if (dragMoved) {
                    // Calculate camera-relative movement vectors
                    const forward = { x: -Math.cos(cameraRotation), z: -Math.sin(cameraRotation) };
                    const right = { x: -Math.sin(cameraRotation), z: Math.cos(cameraRotation) };

                    // Move camera based on drag (inverted for natural "grab and drag" feel)
                    cameraTarget.x += right.x * deltaX * DRAG_SPEED + forward.x * deltaY * DRAG_SPEED;
                    cameraTarget.z += right.z * deltaX * DRAG_SPEED + forward.z * deltaY * DRAG_SPEED;

                    // Update start position for continuous dragging
                    dragStartX = e.clientX;
                    dragStartY = e.clientY;
                }
            }
        });

        renderer.domElement.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                isDragging = false;
                renderer.domElement.style.cursor = 'default';
            }
        });

        renderer.domElement.addEventListener('mouseleave', () => {
            isDragging = false;
            renderer.domElement.style.cursor = 'default';
        });

        renderer.domElement.addEventListener('click', (e) => {
            // Don't trigger click if we were dragging
            if (dragMoved) {
                dragMoved = false;
                return;
            }

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            for (const entity of entities) {
                if (raycaster.intersectObject(entity.model, true).length > 0) {
                    showDialog(entity, e.clientX, e.clientY);
                    return;
                }
            }
        });

        function showDialog(entity, sx, sy) {
            const dialog = document.getElementById('dialogBox');
            document.getElementById('dialogTitle').textContent =
                `${{cow:'🐄',chicken:'🐔',cat:'🐱',dog:'🐕',human:'👤'}[entity.type]} ${entity.name}`;
            document.getElementById('dialogText').textContent = entity.getDialogue();
            dialog.style.left = Math.min(sx + 20, window.innerWidth - 300) + 'px';
            dialog.style.top = Math.max(sy - 50, 10) + 'px';
            dialog.className = 'show';
        }

        function closeDialog() { document.getElementById('dialogBox').className = ''; }

        // Options panel
        const optionsPanel = document.getElementById('optionsPanel');
        const sunlightSlider = document.getElementById('sunlightSlider');
        const hemisphereSlider = document.getElementById('hemisphereSlider');
        const sunlightValue = document.getElementById('sunlightValue');
        const hemisphereValue = document.getElementById('hemisphereValue');

        function toggleOptions() {
            optionsPanel.classList.toggle('show');
        }

        function closeOptions() {
            optionsPanel.classList.remove('show');
        }

        sunlightSlider.addEventListener('input', e => {
            const val = parseFloat(e.target.value);
            sunLight.intensity = val;
            sunlightValue.textContent = val.toFixed(2);
        });

        hemisphereSlider.addEventListener('input', e => {
            const val = parseFloat(e.target.value);
            hemisphereLight.intensity = val;
            hemisphereValue.textContent = val.toFixed(2);
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeDialog();
                closeOptions();
            }
            if (e.key.toLowerCase() === 'o') {
                toggleOptions();
            }
        });

        renderer.domElement.addEventListener('wheel', e => {
            e.preventDefault();
            frustumSize = Math.max(12, Math.min(50, frustumSize + e.deltaY * 0.03));
            updateCameraFrustum();
        });

        function updateCameraFrustum() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -frustumSize * aspect / 2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = -frustumSize / 2;
            camera.updateProjectionMatrix();
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateCameraFrustum();
        });

        // ============================================
        // MINIMAP
        // ============================================
        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');

        function drawMinimap() {
            minimapCtx.fillStyle = '#0a0a15';
            minimapCtx.fillRect(0, 0, 180, 180);

            const scale = 3;
            const offsetX = 90;
            const offsetZ = 90;

            // Draw chunks
            chunks.forEach((chunk, key) => {
                const [cx, cz] = key.split(',').map(Number);
                const color = chunk.type === 'hub' ? '#6c5ce7' :
                              chunk.type === 'end' ? '#e74c3c' : '#4a7c3f';
                minimapCtx.fillStyle = color;
                minimapCtx.fillRect(
                    offsetX + cx * scale * 2 - scale,
                    offsetZ + cz * scale * 2 - scale,
                    scale * 2, scale * 2
                );
            });

            // Draw entities
            entities.forEach(e => {
                const mx = offsetX + (e.x / (CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE)) * scale * 2;
                const mz = offsetZ + (e.z / (CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE)) * scale * 2;
                minimapCtx.fillStyle = e.type === 'human' ? '#ff69b4' : '#fff';
                minimapCtx.fillRect(mx - 1, mz - 1, 2, 2);
            });

            // Draw camera position
            const camX = offsetX + (cameraTarget.x / (CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE)) * scale * 2;
            const camZ = offsetZ + (cameraTarget.z / (CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE)) * scale * 2;
            minimapCtx.strokeStyle = '#fff';
            minimapCtx.lineWidth = 2;
            minimapCtx.strokeRect(camX - 8, camZ - 8, 16, 16);
        }

        // ============================================
        // AREA NAME UPDATE
        // ============================================
        function updateAreaName() {
            const chunkX = Math.floor(cameraTarget.x / (CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE));
            const chunkZ = Math.floor(cameraTarget.z / (CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE));
            const chunk = chunks.get(`${chunkX},${chunkZ}`);
            document.getElementById('areaName').textContent = chunk ? chunk.name : 'The Void';
        }

        // ============================================
        // GAME LOOP
        // ============================================
        let lastTime = 0;
        let boundaryTimeout = null;

        function animate(currentTime) {
            requestAnimationFrame(animate);
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            // Camera-relative movement
            const forward = { x: -Math.cos(cameraRotation), z: -Math.sin(cameraRotation) };
            const right = { x: -Math.sin(cameraRotation), z: Math.cos(cameraRotation) };

            let moved = false;
            if (keys['w'] || keys['arrowup']) { cameraTarget.x += forward.x * CONFIG.CAMERA_SPEED; cameraTarget.z += forward.z * CONFIG.CAMERA_SPEED; moved = true; }
            if (keys['s'] || keys['arrowdown']) { cameraTarget.x -= forward.x * CONFIG.CAMERA_SPEED; cameraTarget.z -= forward.z * CONFIG.CAMERA_SPEED; moved = true; }
            if (keys['a'] || keys['arrowleft']) { cameraTarget.x -= right.x * CONFIG.CAMERA_SPEED; cameraTarget.z -= right.z * CONFIG.CAMERA_SPEED; moved = true; }
            if (keys['d'] || keys['arrowright']) { cameraTarget.x += right.x * CONFIG.CAMERA_SPEED; cameraTarget.z += right.z * CONFIG.CAMERA_SPEED; moved = true; }
            if (keys['q']) cameraRotation -= 0.025;
            if (keys['e']) cameraRotation += 0.025;

            // Check if in void
            const chunkX = Math.floor(cameraTarget.x / (CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE));
            const chunkZ = Math.floor(cameraTarget.z / (CONFIG.CHUNK_SIZE * CONFIG.TILE_SIZE));
            if (!chunks.has(`${chunkX},${chunkZ}`) && moved) {
                const warning = document.getElementById('boundaryWarning');
                warning.style.display = 'block';
                if (boundaryTimeout) clearTimeout(boundaryTimeout);
                boundaryTimeout = setTimeout(() => warning.style.display = 'none', 1500);
            }

            updateCameraPosition();
            updateAreaName();

            entities.forEach(e => e.update(deltaTime));

            // Animate boundary tiles
            chunkMeshes.forEach(group => {
                group.children.forEach(mesh => {
                    if (mesh.userData.isVoidEdge) {
                        mesh.material.emissiveIntensity = 0.3 + Math.sin(currentTime * 0.003) * 0.2;
                    }
                });
            });

            drawMinimap();
            renderer.render(scene, camera);
        }

        document.getElementById('loading').style.display = 'none';
        animate(0);

        console.log('🐙 AI Wars - Octopus World Generated');
        console.log(`Created ${chunks.size} chunks with ${entities.length} entities`);
        console.log(`Settings: ${CONFIG.NUM_TENTACLES} tentacles, ${CONFIG.TENTACLE_LENGTH} length, ${CONFIG.MAX_BRANCH_DEPTH} branch depth`);
        console.log(`Memory optimization: ${geometryCache.size} cached geometries, ${entityMaterialCache.size} cached materials`);
        console.log(`Three.js memory: ${renderer.info.memory.geometries} geometries, ${renderer.info.memory.textures} textures`);
    </script>
</body>
</html>
