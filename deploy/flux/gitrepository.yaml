# Where Flux finds the chart.
#
# The chart lives in the application's own repository rather than in a separate one holding the
# cluster's desired state, and that is deliberate: the chart describes how *this* application
# deploys, so it belongs beside the code it deploys and versions with it. A cluster that runs the
# game points at this; a cluster that does not, does not.
#
# Flux polls rather than being pushed to. Nothing needs an inbound webhook, no CI needs credentials
# to the cluster, and a Raspberry Pi behind a domestic router is as reachable as anything else —
# which is most of why GitOps suits a homelab at all.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ai-world
  namespace: flux-system
spec:
  # A minute is a compromise: fast enough that a push feels like a deploy, slow enough that the
  # cluster is not hammering GitHub all day for a repository that changes a few times a week.
  interval: 1m
  url: https://github.com/christhomas/ai.world
  ref:
    # Track a branch rather than a tag, because the chart's own version is what pins a release —
    # `HelmRelease` reads chart.spec.version, so following main here does not mean following main
    # into production. Change to `tag:` if you would rather the source itself be pinned.
    branch: main
  # Only the chart is needed. Without this, every push to the game — every texture, every test —
  # produces a new artifact for Flux to reconcile against, and the cluster does work for changes
  # that cannot possibly affect it.
  ignore: |
    /*
    !/chart
