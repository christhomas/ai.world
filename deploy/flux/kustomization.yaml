# The namespace and the release together, so a cluster adopts the game with one reference rather
# than two.
#
# Whatever holds the cluster's desired state points a Flux Kustomization at this directory. The
# GitRepository it reads this from is that cluster's to create — it is the thing that found this
# directory, so it cannot also be described inside it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrelease.yaml
