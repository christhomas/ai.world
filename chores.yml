# Running ai.world: the page, the world server, and the checks that guard both.
#
# The game is two halves. The page is grown from a seed and plays perfectly alone; the world
# server holds the little that people share — the clock, the market, the post shelf, the log of
# what players changed. `chore dev` runs both, and Ctrl-C stops both.
chore_min_version: 0.9.0

vars:
  WEB_PORT: '5173'
  WORLD_PORT: '8787'
  # One JSON file per seed lives here. Deleting one forgets that world's shared state, nothing else.
  WORLD_DATA: server/data

tasks:
  dev:
    desc: The page and the world server, together
    before: ['{{.CHORE_EXE}} install']
    deps: [web, world]

  # Anything after -- is handed to vite, so `chore web -- --host` opens it to the network.
  web:
    desc: The page alone, on its own port
    vars:
      PORT: '{{.WEB_PORT}}'
    args:
      - name: port
        desc: port to serve the page on
    cmds:
      - 'pnpm vite --port {{.PORT}} --strictPort {{.CLI_ARGS}}'

  # The two pages that are tools rather than the game. Both need the dev server — they import the
  # game's own modules by path, so opening the file from disk gets you a blank screen and a console
  # full of bare-specifier errors, which is how somebody finds out the hard way that this is not a
  # standalone page. And a wrong URL is worse than a broken one here: Vite answers anything it does
  # not recognise with the game's own index.html, so a mistyped name gives you the game rather than
  # a 404, and it looks as though the tool is what is broken.
  #
  # So there is a command. It serves and it prints the address; there is nothing to remember and
  # nothing to type wrong.
  builder:
    desc: The character builder — every creature and every prop, with Claude on hand to change one
    vars:
      # Its own port, and not the game's. 5173 is what every Vite in the world reaches for first,
      # so on any machine doing more than one thing it is the port most likely to be taken — here
      # a virtual machine from an unrelated project holds it, and the builder inherited a clash it
      # had no reason to be in. The tool a person opens least often should not be the one fighting
      # for the busiest port.
      PORT: '5273'
    args:
      - name: port
        desc: port to serve it on
    cmds:
      # No `--strictPort`, and nothing echoed here. Both were mistakes and they made the same one:
      # 5173 on this machine is held by a virtual machine from an unrelated project, so the port
      # asked for is routinely not the port you get. With `--strictPort` the server simply died,
      # after this line had already printed an address for it — so you were handed a URL that could
      # never work and a browser saying it could not reach the page.
      #
      # Vite moves to the next free port on its own, and prints where it landed. `askclaude.ts`
      # prints the builder's own address from the bound listener, once there is one to print.
      - 'pnpm vite --port {{.PORT}} {{.CLI_ARGS}}'

  world:
    desc: The world server alone, holding what players share
    vars:
      PORT: '{{.WORLD_PORT}}'
    args:
      - name: port
        desc: port the server listens on
    env:
      PORT: '{{.PORT}}'
      DATA_DIR: '{{.WORLD_DATA}}'
    cmds:
      - 'pnpm tsx server/index.ts {{.CLI_ARGS}}'

  preview:
    desc: The built page, served as it will be deployed
    before: ['{{.CHORE_EXE}} build']
    cmds: ['pnpm vite preview --port {{.WEB_PORT}}']

  # Playing at home: one machine — a Raspberry Pi on a shelf, say — serving both the page and the
  # world on one port. Same origin, so no certificate is needed and nobody types an address: the
  # page works out its own server from where it was served. Everyone else on the network opens
  # http://<that machine>.local:8787/ and is in the same world.
  home:
    desc: Serve the game and the world together, for a machine on your own network
    vars:
      PORT: '{{.WORLD_PORT}}'
    args:
      - name: port
        desc: port to serve both halves on
    env:
      PORT: '{{.PORT}}'
      DATA_DIR: '{{.WORLD_DATA}}'
      STATIC_DIR: dist
    cmds:
      - 'BASE=/ pnpm vite build'
      - 'pnpm tsx server/index.ts'

  # Driving a game that is already running, from a terminal. `chore cmd -- teleport 322 53` goes to
  # the dev server, down Vite's own channel, and into every tab it is serving; `chore cmd -- help`
  # lists what a tab will answer to. Nothing here reaches a real world — that door is on the world
  # server, wants OPERATOR_TOKEN, and is described in docs/server-authority.md.
  cmd:
    desc: Run a command in whatever the dev server is serving
    args:
      - name: line
        desc: the command and its arguments, e.g. "teleport 322 53"
    cmds:
      - 'curl -sS -X POST --data "{{.LINE}}" http://localhost:{{.WEB_PORT}}/__command'
      - 'sleep 0.4'
      # what the page said happened, which is the only way to see the answer to a question like
      # `where` or `peaks` from out here
      - 'curl -sS http://localhost:{{.WEB_PORT}}/__command'

  install:
    desc: Dependencies, if they are not already there
    sources: [package.json, pnpm-lock.yaml]
    generates: [node_modules/.modules.yaml]
    cmds: [pnpm install]

  art:
    desc: Draw a piece of the game's artwork on the terminal, beside what it would replace
    args: [subject]
    vars:
      SUBJECT: ''
    cmds:
      - pnpm exec tsx tools/art/show.ts {{.SUBJECT}} {{.CLI_ARGS}}

  ask:
    desc: 'Ask Claude for new artwork: chore ask faces warmer -- "warmer skin, softer hair"'
    args: [subject, name]
    vars:
      SUBJECT: faces
      NAME: ''
    cmds:
      - tools/art/ask.sh {{.SUBJECT}} {{.NAME}} {{.CLI_ARGS}}

  faces:
    desc: A contact sheet of generated villager faces in a browser, at any size
    cmds:
      - 'echo "open http://localhost:5173/tools/faces.html (run: chore web) — or stay in the terminal with: chore art faces"'

  # The design canvas in `design/`, from the terminal. `chore design` lists the artboards, `chore
  # design read HudA` prints the words on one, and `chore design check` says where the drawing and
  # the game have drifted apart — which is the one of the three worth running unprompted, because a
  # design goes stale silently and nobody finds out until somebody builds from it.
  design:
    desc: Read the design canvas, and check it against the game
    args: [what, which]
    vars:
      WHAT: ''
      WHICH: ''
    cmds:
      - 'pnpm exec tsx tools/design.ts {{.WHAT}} {{.WHICH}}'

  # Claude Design itself, over its own API: `chore design-api tools` asks the service what it can
  # do and prints it, `chore design-api call <tool> k=v` calls one. It needs an Anthropic API key —
  # `printf %s "sk-ant-..." | chore design-api key` keeps one in ~/.config/anthropic/design-key,
  # readable by you alone and never in a shell history.
  design-api:
    desc: Talk to Claude Design over its API, and see what it offers
    args: [what, rest]
    vars:
      WHAT: ''
      REST: ''
    cmds:
      - 'pnpm exec tsx tools/designapi.ts {{.WHAT}} {{.REST}} {{.CLI_ARGS}}'

  check:
    desc: Typecheck and test, the gate before a commit
    cmds:
      - task: typecheck
      - task: test
      - task: collisions
      - task: wire
      - task: halves
      - task: economy
      - task: sanity

  typecheck:
    desc: Types only
    cmds: [pnpm tsc --noEmit]

  # One door to the suites: `chore test` runs the lot, `chore test <name>` runs one of the benches,
  # and anything else is handed to vitest as a pattern the way it always was.
  #
  # The benches have tasks of their own as well — they write reports and a pipeline names them —
  # and this delegates to those rather than repeating them, so there is one description of how each
  # is run and one place a report is printed from.
  test:
    desc: Every suite, or one of them by name
    vars:
      SUITE: ''
    args:
      - name: suite
        desc: 'collisions, wire (protocol), halves (world), economy (villages), sanity (four hundred days), or a path to match — nothing runs everything'
    cmds:
      - |
        case "{{.SUITE}}" in
          "")                 pnpm vitest run ;;
          collisions)         {{.CHORE_EXE}} collisions ;;
          wire|protocol)      {{.CHORE_EXE}} wire ;;
          halves|world)       {{.CHORE_EXE}} halves ;;
          economy|villages)   {{.CHORE_EXE}} economy ;;
          sanity)             {{.CHORE_EXE}} sanity ;;
          *)                  pnpm vitest run "{{.SUITE}}" ;;
        esac

  # The bench that walks everything into everything. Its own task rather than part of `test`
  # because it is the one a pipeline is meant to name, and because what it leaves behind — an
  # account of what it walked and what went wrong — is the thing somebody investigating a failure
  # asks for. See `src/world/collisions.test.ts`.
  collisions:
    desc: Walk every creature into every solid thing, and say what happened
    vars:
      REPORT: docs/reports/collision-report.txt
    cmds:
      # One command rather than two, so that the account is printed on the way past whether the
      # bench passed or failed — the run that failed is the one somebody wants to read — while the
      # bench's own exit code is what the task exits with, so a pipeline naming this task stops.
      - 'pnpm vitest run src/world/collisions.test.ts; kept=$?; cat {{.REPORT}} || true; echo "report written to {{.REPORT}}"; exit $kept'

  # What a seed is worth, measured over as many of them as you ask for. Chooses nothing: #323 says
  # the cut goes where the tail plainly is, and nobody can see that until the spread is on a page.
  seeds:
    desc: Measure the home patch of many seeds, and print the spread
    args:
      - name: many
        desc: how many seeds to measure; 200 if not said
    cmds:
      - 'pnpm tsx tools/seedscore.ts {{.CLI_ARGS}}'

  # The other bench: every message the two halves can send each other, and whether anybody is
  # listening. A message nobody handles type-checks, goes up the wire, and does nothing — which is
  # what "I wake in the village and get dragged back to the wolf" was. See `server/wire.test.ts`.
  wire:
    desc: Check every message between the game and the world has somebody listening
    vars:
      REPORT: docs/reports/wire-report.txt
    cmds:
      - 'pnpm vitest run server/wire.test.ts; kept=$?; cat {{.REPORT}} || true; echo "report written to {{.REPORT}}"; exit $kept'

  # The third bench: the page and the server grow the same world from the same seed and never send
  # each other a landscape, so the only thing keeping them in the same country is that they agree.
  # When they did not, it was three impossible bug reports at once. See `src/world/twohalves.test.ts`.
  halves:
    desc: Ask both halves the same questions about the world, and fail on any different answer
    vars:
      REPORT: docs/reports/halves-report.txt
    cmds:
      - 'pnpm vitest run src/world/twohalves.test.ts; kept=$?; cat {{.REPORT}} || true; echo "report written to {{.REPORT}}"; exit $kept'

  # The fourth bench: a hundred days in seven villages, and the books held to what the purses
  # actually did. It reads only what a village writes down — the roll, the stones, the births — and
  # audits every coin against it, so a village that quietly stopped paying anybody, or buried
  # people without writing it down, or was still being charged rent by a warband that left three
  # weeks ago, shows up as a village, a day and a number. See `src/game/economy.test.ts`.
  reachable:
    desc: Exported work that only its own tests reach — a ratchet, so it can only ever shrink
    vars:
      REPORT: docs/reports/unreached-report.txt
    cmds:
      - 'pnpm vitest run src/world/reachable.test.ts; kept=$?; cat {{.REPORT}} || true; exit $kept'

  # Two counters in two countries, walked in a real browser. The unit tests hold the selection, the
  # way out and the pricing rule apart; this is the one thing that can see them working together —
  # and the one thing that can see a counter priced at the room the hero is standing in rather than
  # at the door it stands behind, because a room's coordinates are local and look correct to every
  # test that does not walk through a door. See `tools/shopwalk.cjs`.
  shopwalk:
    desc: Enter a named shop and the nearest one, leave again, and price the same pelt in two countries
    vars:
      REPORT: docs/reports/shopwalk-report.txt
    cmds:
      - 'node tools/shopwalk.cjs; walked=$?; cat {{.REPORT}} || true; exit $walked'
  excuses:
    desc: Excuses for unreached exports that have outlived the issue they name — asks GitHub, so it needs a token
    cmds:
      - 'pnpm tsx tools/staleexcuses.ts'
  # The first thing a session should run in a checkout it did not just make. Several agent sessions
  # were run against one tree at once and the result was not a merge conflict — it was two
  # afternoons, including two implementations of the same function in the same file with different
  # rules, neither of which knew about the other. See item 137 and `tools/sharedtree.ts`.
  tree:
    desc: Whether it is safe to start work in this checkout, or somebody else's uncommitted work is in it
    cmds:
      - 'pnpm tsx tools/sharedtree.ts'

  fallbacks:
    desc: Which fallback expressions or exported parameter defaults are taken every single time
    vars:
      TARGET: ''
    args:
      - name: target
        desc: source/test targets, or --browser followed by screenshot names
    cmds:
      - 'pnpm tsx tools/fallbacks.ts {{.CLI_ARGS}}'

  economy:
    desc: Live a village forward and hold its own books to it — a hundred days, or as many as asked
    args:
      - name: days
        desc: how many days to live, default 100. A lifetime is 60 to 90, so ask for more to see past one
    vars:
      REPORT: docs/reports/economy-report.txt
      # A default here rather than on the argument, which is what makes `chore economy` with no
      # length keep meaning exactly what it meant before this was askable at all.
      DAYS: '100'
    cmds:
      # The length goes through the environment because `RUNS` is a module constant every bench
      # imports; see `src/game/benchdays.ts`. Bounds tuned at a hundred days report rather than fail
      # at any other length, because a bench that goes red for being asked a longer question is a
      # bench somebody turns off.
      - 'BENCH_DAYS={{.DAYS}} pnpm vitest run src/game/economy.test.ts; kept=$?; cat {{.REPORT}} || true; echo "report written to {{.REPORT}}"; exit $kept'

  # The same hundred days read for the people rather than for the money. The economy bench can say
  # that somebody died and cannot say whether anybody was born to replace them, which is the half of
  # a village that decides whether it is there in a year. Issue #255.
  population:
    desc: Read the same days for who was born, who grew up, and what the village had room for
    args:
      - name: days
        desc: how many days to live, default 100 — the same length `chore economy` takes
    vars:
      REPORT: docs/reports/population-report.txt
      DAYS: '100'
    cmds:
      - 'BENCH_DAYS={{.DAYS}} pnpm vitest run src/game/population.test.ts; kept=$?; cat {{.REPORT}} || true; echo "report written to {{.REPORT}}"; exit $kept'

  # The fifth bench, and the other half of the one above: four hundred and fifty days of the same
  # villages, judged on whether they are still places anybody would believe in rather than on
  # whether the books add up. The audit passes a village that has lost every farmer it ever had, to
  # the coin, every evening. This asks what a person would ask on walking in — is anybody still
  # here, do they do more than two things between them, are there beasts in the field, does one man
  # own everything. It is the guard rail under everything that makes a village grow. See
  # `src/game/sanity.test.ts`.
  sanity:
    desc: Live a village forward four hundred and fifty days and ask whether it is still a village
    vars:
      REPORT: docs/reports/sanity-report.txt
    cmds:
      - 'pnpm vitest run src/game/sanity.test.ts; kept=$?; cat {{.REPORT}} || true; echo "report written to {{.REPORT}}"; exit $kept'
  # The fourth, and the only one that looks at the screen rather than at the arithmetic behind it: a
  # script plays the game in a browser and says whether what is drawn is what the world has. It
  # serves the page itself when nothing is answering on the port and puts that server away
  # afterwards, so this is one command from a cold start; a dev server you already have up is played
  # against and left alone. It prints its own PASS lines as it goes and names the report at the end,
  # so nothing here cats it.
  #
  # Deliberately not part of `chore check`. It costs two minutes against that gate's few seconds,
  # and it needs a browser and a borrowed playwright, which `check` needs nothing of — a gate too
  # slow to run before a commit stops being run at all. CI gives it a job of its own instead.
  playtest:
    desc: Play the game in a browser, and check the screen and the simulation agree
    vars:
      REPORT: docs/reports/playtest-report.txt
      PORT: '{{.WEB_PORT}}'
    args:
      - name: port
        desc: port the page is on — a server already answering there is used as it stands
    env:
      PORT: '{{.PORT}}'
      OUT: '{{.REPORT}}'
    cmds:
      # Playwright is not a dependency of this project on purpose; the head of the script says why.
      # Say so plainly rather than letting node's own "cannot find module" be the explanation.
      - |
        node -e 'require.resolve("playwright")' 2>/dev/null || {
          echo "No playwright, which this project deliberately does not depend on. Borrow one:"
          echo "  NODE_PATH=<a checkout that has playwright> chore playtest"
          exit 1
        }
        node tools/playtest.cjs

  # The Domesday Book: what a world server is holding, which is the half of a world nobody is
  # standing in. A window and not a door — `GET /registry` changes nothing — so the read-only
  # watch token opens it as well as the operator one.
  #
  # The book is called the Domesday Book on the page and `registry` everywhere a machine reads it.
  # A name worth having in a heading is not a name worth typing into an address bar.
  registry:
    desc: The Domesday Book, served and pointed at a world server
    vars:
      # its own port, so it can sit open beside the game and the builder without fighting either
      PORT: '5373'
      AT: '{{.DOMESDAY_AT | default "http://localhost:8787"}}'
    args:
      - name: seed
        desc: which world to open the book on
    cmds:
      - |
        echo "Domesday Book: http://localhost:{{.PORT}}/tools/registry.html?at={{.AT}}&seed={{.CLI_ARGS}}"
        echo
        echo "The server needs a token before it will answer:"
        echo "  OPERATOR_WATCH_TOKEN=<something> chore world"
        echo "and you type that token into the page. A world holds no people until somebody has"
        echo "played in it — join the same seed and stand in a village, or the book is empty."
        echo
      - 'pnpm vite --port {{.PORT}}'

  # WORLD=endless and SEED=7 take the same shot in another country, or on another seed, without
  # editing the spec: there are two generators behind one seam and judging them means the same
  # camera twice. See tools/shots.cjs.
  shots:
    desc: Retake the README's screenshots, or the ones named
    vars:
      PORT: '{{.WEB_PORT}}'
    args:
      - name: shot
        desc: which ones to take; none means all of them, and `--list` says what there is
    env:
      PORT: '{{.PORT}}'
    cmds:
      # Same borrowed playwright as `playtest`, and the same reason: a browser toolchain has no
      # business in the world-server image, which installs this project's dependencies twice.
      - |
        node -e 'require.resolve("playwright")' 2>/dev/null || {
          echo "No playwright, which this project deliberately does not depend on. Borrow one:"
          echo "  NODE_PATH=<a checkout that has playwright> chore shots"
          exit 1
        }
        node tools/shots.cjs {{.CLI_ARGS}}

  # The phone, which is a different product from the desktop game and was photographed once.
  #
  # A panel that reads well at 900x600 can be unusable at 420 wide — the rucksack is a grid, the map
  # is full-screen, and both are laid out against a width a phone does not have. This takes the same
  # screens at phone size so "it looks wrong on my phone" becomes a picture somebody can point at.
  #
  #   chore phone                          take them
  #   cp -r docs/screenshots /tmp/before   keep them
  #   ...change the layout...
  #   chore phone && chore compare -- /tmp/before
  phone:
    desc: Photograph the game at phone size — the square, the title, the rucksack, the map, and after dark
    vars:
      PORT: '{{.WEB_PORT}}'
    env:
      PORT: '{{.PORT}}'
    cmds:
      - |
        node -e 'require.resolve("playwright")' 2>/dev/null || {
          echo "No playwright, which this project deliberately does not depend on. Borrow one:"
          echo "  NODE_PATH=<a checkout that has playwright> chore phone"
          exit 1
        }
        node tools/shots.cjs phone phone-title phone-rucksack phone-map phone-night

  # Whether the pictures changed, which nothing in this repository could say until now. `shots`
  # pins the world, the seed and the camera so a shot can be retaken exactly; this reads two sets
  # and reports what moved. It is the thing that makes "the reference screenshots are unchanged" —
  # #249's acceptance and #250's — a sentence somebody can evaluate rather than squint at.
  compare:
    desc: Compare docs/screenshots against another set, and say what moved
    args:
      - name: against
        desc: the directory of pictures to compare against
    cmds:
      - |
        node -e 'require.resolve("playwright")' 2>/dev/null || {
          echo "No playwright, which this project deliberately does not depend on. Borrow one:"
          echo "  NODE_PATH=<a checkout that has playwright> chore compare -- <dir>"
          exit 1
        }
        node tools/compare.cjs {{.CLI_ARGS}}

  build:
    desc: Typecheck and build the page into dist/
    cmds: [pnpm build]

  worlds:
    desc: The worlds this server has kept, and what is in them
    silent: true
    cmds: ['pnpm tsx server/worlds.ts {{.WORLD_DATA}}']

  forget:
    desc: Forget one world's shared state, leaving the world itself untouched
    args:
      - name: seed
        desc: which world to forget
    cmds:
      - 'rm -f {{.WORLD_DATA}}/{{.SEED}}.json'
      - 'echo "World {{.SEED}} starts again from its seed alone."'

  ping:
    desc: Ask a running world server how it is
    silent: true
    vars:
      PORT: '{{.WORLD_PORT}}'
    args:
      - name: port
        desc: port to ask
    cmds:
      - 'curl -s -m 3 http://localhost:{{.PORT}}/ || echo "Nothing answering on {{.PORT}}."'

  # Somewhere to put the server so that other people can reach it. The page is published to
  # GitHub Pages over https, and a browser refuses to open a plain ws:// socket from an https
  # page, so a server anybody outside your own network can play on has to answer over wss://.
  # That means a container behind something holding a certificate: `chore up` locally, `chore
  # deploy` for the real one.

  # Cutting a release, which is one act: the chart's version, the game's version, the tag on the
  # commit and the image all name the same moment. `chore release 0.3.0 "what is in it"`, or
  # `chore release minor`. It refuses a dirty tree, refuses to run off main, and runs the tests
  # first, because a release is the wrong place to find out.
  release:
    desc: Bump the chart and the game, tag the commit, and publish the release that builds the image
    args:
      - name: version
        desc: a version like 0.3.0, or major, minor or patch
      - name: note
        desc: one line about what is in it
    cmds:
      # quoted, because a note is a sentence and a sentence has apostrophes in it
      - 'pnpm exec tsx tools/release.ts "{{.VERSION}}" "{{.NOTE}}"'

  # What a world server actually costs, on the machine it is actually running on. Stands up a crowd
  # of players, walks them about, and says how much came back and how much of it was creatures.
  # `chore crowd -- ws://aiworld.homelab.local 8 60` — read it next to `kubectl top pod`.
  crowd:
    desc: Put a crowd of players on a world server and measure what it sends them
    cmds:
      - 'pnpm exec tsx tools/crowd.ts {{.CLI_ARGS}}'

  # The other half of that pair, and the processor's side of it: how many live agents this machine
  # steps ten times a second, and what a cold province costs to arrive in. In-process, so there is
  # no server to start first. `chore ticks -- 1` for one run instead of three. See `tools/ticks.ts`.
  ticks:
    desc: Measure how many live agents this machine ticks at ten a second, and what a province costs
    vars:
      REPORT: docs/reports/tick-report.txt
    cmds:
      - 'pnpm exec tsx tools/ticks.ts {{.CLI_ARGS}}; kept=$?; echo "report written to {{.REPORT}}"; exit $kept'

  bundle:
    desc: Roll the world server into one file, the way the image ships it
    cmds: ['pnpm vite build --config server/build.config.ts']

  # The container, run by these two and not by a compose file.
  #
  # Compose was one service with a build, a port, a restart policy and a named volume — every line
  # of which is a flag on `docker run`, and none of which needed a second file and a second tool to
  # say. `chore` is how everything else in this project is run; a container was the one thing that
  # asked somebody to know about a different orchestrator to start it.
  #
  # The volume is named rather than a bind mount, deliberately: Docker gives a named volume the
  # image's own ownership, so the unprivileged user in the container can write to it on any host.
  # To read the worlds from the host instead, swap it for `-v ./server/data:/data` and
  # `chore worlds` will see them.
  up:
    desc: The world server in a container, its worlds on a volume that outlives it
    cmds:
      - docker build -t ai-world-server .
      # flags land before the image, so `chore up -- -d` leaves it running in the background
      - >-
        docker run --rm -p 8787:8787 -v ai-world-data:/data --name ai-world
        {{.CLI_ARGS}} ai-world-server

  down:
    desc: Stop that container, keeping every world it has kept
    # the volume is untouched: stopping a server is not the same as forgetting its worlds
    cmds: ['docker rm -f ai-world 2>/dev/null || true']

  deploy:
    desc: Publish the world server to Fly.io, where it answers over wss://
    cmds: ['fly deploy']
