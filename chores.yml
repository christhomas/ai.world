# Running ai.world: the page, the world server, and the checks that guard both.
#
# The game is two halves. The page is grown from a seed and plays perfectly alone; the world
# server holds the little that people share — the clock, the market, the post shelf, the log of
# what players changed. `chore dev` runs both, and Ctrl-C stops both.
chore_min_version: 0.9.0

vars:
  WEB_PORT: '5173'
  WORLD_PORT: '8787'
  # One JSON file per seed lives here. Deleting one forgets that world's shared state, nothing else.
  WORLD_DATA: server/data

tasks:
  dev:
    desc: The page and the world server, together
    before: ['{{.CHORE_EXE}} install']
    deps: [web, world]

  # Anything after -- is handed to vite, so `chore web -- --host` opens it to the network.
  web:
    desc: The page alone, on its own port
    vars:
      PORT: '{{.WEB_PORT}}'
    args:
      - name: port
        desc: port to serve the page on
    cmds:
      - 'pnpm vite --port {{.PORT}} --strictPort {{.CLI_ARGS}}'

  world:
    desc: The world server alone, holding what players share
    vars:
      PORT: '{{.WORLD_PORT}}'
    args:
      - name: port
        desc: port the server listens on
    env:
      PORT: '{{.PORT}}'
      DATA_DIR: '{{.WORLD_DATA}}'
    cmds:
      - 'pnpm tsx server/index.ts {{.CLI_ARGS}}'

  preview:
    desc: The built page, served as it will be deployed
    before: ['{{.CHORE_EXE}} build']
    cmds: ['pnpm vite preview --port {{.WEB_PORT}}']

  # Playing at home: one machine — a Raspberry Pi on a shelf, say — serving both the page and the
  # world on one port. Same origin, so no certificate is needed and nobody types an address: the
  # page works out its own server from where it was served. Everyone else on the network opens
  # http://<that machine>.local:8787/ and is in the same world.
  home:
    desc: Serve the game and the world together, for a machine on your own network
    vars:
      PORT: '{{.WORLD_PORT}}'
    args:
      - name: port
        desc: port to serve both halves on
    env:
      PORT: '{{.PORT}}'
      DATA_DIR: '{{.WORLD_DATA}}'
      STATIC_DIR: dist
    cmds:
      - 'BASE=/ pnpm vite build'
      - 'pnpm tsx server/index.ts'

  # Driving a game that is already running, from a terminal. `chore cmd -- teleport 322 53` goes to
  # the dev server, down Vite's own channel, and into every tab it is serving; `chore cmd -- help`
  # lists what a tab will answer to. Nothing here reaches a real world — that door is on the world
  # server, wants OPERATOR_TOKEN, and is described in docs/server-authority.md.
  cmd:
    desc: Run a command in whatever the dev server is serving
    args:
      - name: line
        desc: the command and its arguments, e.g. "teleport 322 53"
    cmds:
      - 'curl -sS -X POST --data "{{.LINE}}" http://localhost:{{.WEB_PORT}}/__command'
      - 'sleep 0.4'
      # what the page said happened, which is the only way to see the answer to a question like
      # `where` or `peaks` from out here
      - 'curl -sS http://localhost:{{.WEB_PORT}}/__command'

  install:
    desc: Dependencies, if they are not already there
    sources: [package.json, pnpm-lock.yaml]
    generates: [node_modules/.modules.yaml]
    cmds: [pnpm install]

  art:
    desc: Draw a piece of the game's artwork on the terminal, beside what it would replace
    args: [subject]
    vars:
      SUBJECT: ''
    cmds:
      - pnpm exec tsx tools/art/show.ts {{.SUBJECT}} {{.CLI_ARGS}}

  ask:
    desc: 'Ask Claude for new artwork: chore ask faces warmer -- "warmer skin, softer hair"'
    args: [subject, name]
    vars:
      SUBJECT: faces
      NAME: ''
    cmds:
      - tools/art/ask.sh {{.SUBJECT}} {{.NAME}} {{.CLI_ARGS}}

  faces:
    desc: A contact sheet of generated villager faces in a browser, at any size
    cmds:
      - 'echo "open http://localhost:5173/tools/faces.html (run: chore web) — or stay in the terminal with: chore art faces"'

  check:
    desc: Typecheck and test, the gate before a commit
    cmds:
      - task: typecheck
      - task: test
      - task: collisions
      - task: wire
      - task: halves

  typecheck:
    desc: Types only
    cmds: [pnpm tsc --noEmit]

  # One door to the suites: `chore test` runs the lot, `chore test <name>` runs one of the benches,
  # and anything else is handed to vitest as a pattern the way it always was.
  #
  # The benches have tasks of their own as well — they write reports and a pipeline names them —
  # and this delegates to those rather than repeating them, so there is one description of how each
  # is run and one place a report is printed from.
  test:
    desc: Every suite, or one of them by name
    vars:
      SUITE: ''
    args:
      - name: suite
        desc: 'collisions, wire (protocol), halves (world), or a path to match — nothing runs everything'
    cmds:
      - |
        case "{{.SUITE}}" in
          "")                 pnpm vitest run ;;
          collisions)         {{.CHORE_EXE}} collisions ;;
          wire|protocol)      {{.CHORE_EXE}} wire ;;
          halves|world)       {{.CHORE_EXE}} halves ;;
          *)                  pnpm vitest run "{{.SUITE}}" ;;
        esac

  # The bench that walks everything into everything. Its own task rather than part of `test`
  # because it is the one a pipeline is meant to name, and because what it leaves behind — an
  # account of what it walked and what went wrong — is the thing somebody investigating a failure
  # asks for. See `src/world/collisions.test.ts`.
  collisions:
    desc: Walk every creature into every solid thing, and say what happened
    vars:
      REPORT: collision-report.txt
    cmds:
      # One command rather than two, so that the account is printed on the way past whether the
      # bench passed or failed — the run that failed is the one somebody wants to read — while the
      # bench's own exit code is what the task exits with, so a pipeline naming this task stops.
      - 'pnpm vitest run src/world/collisions.test.ts; kept=$?; cat {{.REPORT}} || true; echo "report written to {{.REPORT}}"; exit $kept'

  # The other bench: every message the two halves can send each other, and whether anybody is
  # listening. A message nobody handles type-checks, goes up the wire, and does nothing — which is
  # what "I wake in the village and get dragged back to the wolf" was. See `server/wire.test.ts`.
  wire:
    desc: Check every message between the game and the world has somebody listening
    vars:
      REPORT: wire-report.txt
    cmds:
      - 'pnpm vitest run server/wire.test.ts; kept=$?; cat {{.REPORT}} || true; echo "report written to {{.REPORT}}"; exit $kept'

  # The third bench: the page and the server grow the same world from the same seed and never send
  # each other a landscape, so the only thing keeping them in the same country is that they agree.
  # When they did not, it was three impossible bug reports at once. See `src/world/twohalves.test.ts`.
  halves:
    desc: Ask both halves the same questions about the world, and fail on any different answer
    vars:
      REPORT: halves-report.txt
    cmds:
      - 'pnpm vitest run src/world/twohalves.test.ts; kept=$?; cat {{.REPORT}} || true; echo "report written to {{.REPORT}}"; exit $kept'

  # The fourth, and the only one that looks at the screen rather than at the arithmetic behind it: a
  # script plays the game in a browser and says whether what is drawn is what the world has. It
  # serves the page itself when nothing is answering on the port and puts that server away
  # afterwards, so this is one command from a cold start; a dev server you already have up is played
  # against and left alone. It prints its own PASS lines as it goes and names the report at the end,
  # so nothing here cats it.
  #
  # Deliberately not part of `chore check`. It costs two minutes against that gate's few seconds,
  # and it needs a browser and a borrowed playwright, which `check` needs nothing of — a gate too
  # slow to run before a commit stops being run at all. CI gives it a job of its own instead.
  playtest:
    desc: Play the game in a browser, and check the screen and the simulation agree
    vars:
      REPORT: playtest-report.txt
      PORT: '{{.WEB_PORT}}'
    args:
      - name: port
        desc: port the page is on — a server already answering there is used as it stands
    env:
      PORT: '{{.PORT}}'
      OUT: '{{.REPORT}}'
    cmds:
      # Playwright is not a dependency of this project on purpose; the head of the script says why.
      # Say so plainly rather than letting node's own "cannot find module" be the explanation.
      - |
        node -e 'require.resolve("playwright")' 2>/dev/null || {
          echo "No playwright, which this project deliberately does not depend on. Borrow one:"
          echo "  NODE_PATH=<a checkout that has playwright> chore playtest"
          exit 1
        }
        node tools/playtest.cjs

  build:
    desc: Typecheck and build the page into dist/
    cmds: [pnpm build]

  worlds:
    desc: The worlds this server has kept, and what is in them
    silent: true
    cmds: ['pnpm tsx server/worlds.ts {{.WORLD_DATA}}']

  forget:
    desc: Forget one world's shared state, leaving the world itself untouched
    args:
      - name: seed
        desc: which world to forget
    cmds:
      - 'rm -f {{.WORLD_DATA}}/{{.SEED}}.json'
      - 'echo "World {{.SEED}} starts again from its seed alone."'

  ping:
    desc: Ask a running world server how it is
    silent: true
    vars:
      PORT: '{{.WORLD_PORT}}'
    args:
      - name: port
        desc: port to ask
    cmds:
      - 'curl -s -m 3 http://localhost:{{.PORT}}/ || echo "Nothing answering on {{.PORT}}."'

  # Somewhere to put the server so that other people can reach it. The page is published to
  # GitHub Pages over https, and a browser refuses to open a plain ws:// socket from an https
  # page, so a server anybody outside your own network can play on has to answer over wss://.
  # That means a container behind something holding a certificate: `chore up` locally, `chore
  # deploy` for the real one.

  # Cutting a release, which is one act: the chart's version, the game's version, the tag on the
  # commit and the image all name the same moment. `chore release 0.3.0 "what is in it"`, or
  # `chore release minor`. It refuses a dirty tree, refuses to run off main, and runs the tests
  # first, because a release is the wrong place to find out.
  release:
    desc: Bump the chart and the game, tag the commit, and publish the release that builds the image
    args:
      - name: version
        desc: a version like 0.3.0, or major, minor or patch
      - name: note
        desc: one line about what is in it
    cmds:
      # quoted, because a note is a sentence and a sentence has apostrophes in it
      - 'pnpm exec tsx tools/release.ts "{{.VERSION}}" "{{.NOTE}}"'

  # What a world server actually costs, on the machine it is actually running on. Stands up a crowd
  # of players, walks them about, and says how much came back and how much of it was creatures.
  # `chore crowd -- ws://aiworld.homelab.local 8 60` — read it next to `kubectl top pod`.
  crowd:
    desc: Put a crowd of players on a world server and measure what it sends them
    cmds:
      - 'pnpm exec tsx tools/crowd.ts {{.CLI_ARGS}}'

  bundle:
    desc: Roll the world server into one file, the way the image ships it
    cmds: ['pnpm vite build --config server/build.config.ts']

  up:
    desc: The world server in a container, its worlds on a volume that outlives it
    cmds: ['docker compose up --build {{.CLI_ARGS}}']

  down:
    desc: Stop that container, keeping every world it has kept
    cmds: ['docker compose down']

  deploy:
    desc: Publish the world server to Fly.io, where it answers over wss://
    cmds: ['fly deploy']
