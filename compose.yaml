services:
  world:
    image: ghcr.io/christhomas/ai-world:${AI_WORLD_TAG:-latest}
    restart: unless-stopped
    ports:
      # Keep the service on loopback when a TLS reverse proxy runs on this host.
      # For a proxy in another container, use a shared Compose network instead.
      - "${AI_WORLD_BIND:-127.0.0.1}:8787:8787"
    environment:
      PORT: "8787"
      DATA_DIR: /data
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      TOOLS_SECRET: ${TOOLS_SECRET:?Set TOOLS_SECRET in .env}
      TOOLS_ADMIN_USER: ${TOOLS_ADMIN_USER:?Set TOOLS_ADMIN_USER in .env}
      TOOLS_ADMIN_PASSWORD: ${TOOLS_ADMIN_PASSWORD:?Set TOOLS_ADMIN_PASSWORD in .env}
    volumes:
      - ai-world-data:/data

volumes:
  ai-world-data:
    name: ai-world-data
