<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap');
    body { margin: 0; font-family: 'IBM Plex Mono', 'Courier New', monospace; }
    a { color: #ffd76a; } a:hover { color: #fff0b8; }
  </style>
</helmet>

<!-- A · CUT STONE on a phone held sideways: 844 x 390, the whole of the glass with the browser gone.
     The same three rules as the desktop — flush to an edge, hairline on the inside edge only, square
     corners — which on a phone also buys back the twenty pixels a floating panel wastes on every
     side. Nothing sits on the hero: the middle of the screen is the game. -->
<div style="width: 844px; height: 390px; position: relative; overflow: hidden; color: #eef2ff; background: linear-gradient(160deg, #4f8a46 0%, #57964c 40%, #3f7a54 72%, #2d6a72 100%)">

  <svg width="844" height="390" style="position: absolute; inset: 0; opacity: 0.5">
    <path d="M0 150 H180 V182 H360 V150 H530 V190 H700 V166 H844 V390 H0 Z" fill="#3c7a41"/>
    <path d="M0 248 H140 V280 H320 V248 H500 V286 H690 V262 H844 V390 H0 Z" fill="#336b3c"/>
    <circle cx="640" cy="126" r="30" fill="#2f6a54"/><circle cx="690" cy="150" r="24" fill="#2f6a54"/>
  </svg>

  <!-- the hero, so the middle of the screen is visibly his and nothing is put on top of him -->
  <div style="position: absolute; left: 402px; top: 176px; width: 26px; height: 44px; background: #2e3a52; box-shadow: 0 3px 0 rgba(0,0,0,0.3)">
    <span style="position: absolute; top: -13px; left: 1px; width: 24px; height: 15px; background: #2f8f5f; display: block"></span>
  </div>

  <!-- ── top-left: what is left of you, flush into the corner ──────────────────── -->
  <div style="position: absolute; top: 0; left: 0; background: rgba(6, 9, 22, 0.72); border-right: 1px solid rgba(214,221,255,0.14); border-bottom: 1px solid rgba(214,221,255,0.14); padding: 9px 14px 8px 10px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; gap: 2px">
      <span style="width: 9px; height: 9px; background: #e8434f"></span><span style="width: 9px; height: 9px; background: #e8434f"></span><span style="width: 9px; height: 9px; background: #e8434f"></span><span style="width: 9px; height: 9px; background: #e8434f"></span><span style="width: 9px; height: 9px; background: #e8434f"></span><span style="width: 9px; height: 9px; background: #e8434f"></span><span style="width: 9px; height: 9px; background: #e8434f"></span><span style="width: 9px; height: 9px; background: #3a2030"></span><span style="width: 9px; height: 9px; background: #3a2030"></span>
    </div>
    <div style="display: flex; gap: 2px">
      <span style="width: 9px; height: 5px; background: #4aa3e8"></span><span style="width: 9px; height: 5px; background: #4aa3e8"></span><span style="width: 9px; height: 5px; background: #4aa3e8"></span><span style="width: 9px; height: 5px; background: #4aa3e8"></span><span style="width: 9px; height: 5px; background: #4aa3e8"></span><span style="width: 9px; height: 5px; background: #203048"></span><span style="width: 9px; height: 5px; background: #203048"></span>
    </div>
    <span style="height: 1px; background: rgba(214,221,255,0.14)"></span>
    <div style="display: flex; align-items: baseline; gap: 12px; font-size: 11px; letter-spacing: 1px">
      <span style="color: #ffd76a">246</span><span style="color: #9aa5cc">⚔4</span><span style="color: #9aa5cc">🛡2</span>
    </div>
  </div>

  <!-- ── top edge, middle: the panel rail, drawn glyphs on one slab ────────────── -->
  <div style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: rgba(6, 9, 22, 0.72); border-left: 1px solid rgba(214,221,255,0.14); border-right: 1px solid rgba(214,221,255,0.14); border-bottom: 1px solid rgba(214,221,255,0.14); display: flex">
    <span style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#dfe5ff" stroke-width="1.6"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>
    </span>
    <span style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center; border-left: 1px solid rgba(214,221,255,0.10)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#dfe5ff" stroke-width="1.6"><path d="M5 8h14v12H5z"/><path d="M9 8V5h6v3"/><path d="M5 13h14"/></svg>
    </span>
    <span style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center; border-left: 1px solid rgba(214,221,255,0.10)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#dfe5ff" stroke-width="1.6"><path d="M4 5h7v14H4z"/><path d="M13 5h7v14h-7z"/><path d="M11 5v14"/></svg>
    </span>
    <span style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center; border-left: 1px solid rgba(214,221,255,0.10)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#dfe5ff" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="#0a0d1c"/><circle cx="15" cy="12" r="2" fill="#0a0d1c"/><circle cx="8" cy="17" r="2" fill="#0a0d1c"/></svg>
    </span>
    <span style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center; border-left: 1px solid rgba(214,221,255,0.10)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#dfe5ff" stroke-width="1.6"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
    </span>
    <span style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center; border-left: 1px solid rgba(214,221,255,0.10)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#dfe5ff" stroke-width="1.6"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>
    </span>
  </div>

  <!-- ── the place you have walked into: type and a rule, sitting under the rail ── -->
  <div style="position: absolute; top: 52px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 5px">
    <span style="font-size: 16px; letter-spacing: 7px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.6), 0 0 16px rgba(0,0,0,0.55)">STONEMERE</span>
    <span style="width: 118px; height: 2px; background: #ffd76a; box-shadow: 0 1px 0 rgba(0,0,0,0.55)"></span>
  </div>

  <!-- ── top-right: the clock and the corner map, flush into the corner ────────── -->
  <div style="position: absolute; top: 0; right: 0; background: rgba(6, 9, 22, 0.72); border-left: 1px solid rgba(214,221,255,0.14); border-bottom: 1px solid rgba(214,221,255,0.14)">
    <div style="display: flex; align-items: baseline; gap: 8px; padding: 6px 10px; border-bottom: 1px solid rgba(214,221,255,0.10)">
      <span style="font-size: 12px; color: #ffd76a">08:14</span>
      <span style="font-size: 8px; color: #7f8bb3; letter-spacing: 2px">DAY 1</span>
    </div>
    <div style="width: 116px; height: 116px; background: #101a2e; position: relative">
      <svg width="116" height="116"><path d="M22 18 H88 V42 H102 V88 H52 V102 H22 Z" fill="#2e5c37"/><path d="M36 52 H70 V76 H36 Z" fill="#3f7a41"/><path d="M0 88 H36 V116 H0 Z" fill="#1d3a5c"/></svg>
      <span style="position: absolute; top: 55px; left: 55px; width: 6px; height: 6px; background: #ff4d4d"></span>
      <span style="position: absolute; top: 36px; left: 36px; width: 44px; height: 36px; border: 1px solid rgba(255,255,255,0.72)"></span>
    </div>
  </div>

  <!-- ── the news: bands off the left edge, above the thumb, never on the hero ─── -->
  <div style="position: absolute; left: 0; bottom: 96px; width: 330px; display: flex; flex-direction: column; gap: 1px">
    <div style="background: rgba(6, 9, 22, 0.68); border-left: 3px solid #ffd76a; padding: 7px 12px; font-size: 10px; line-height: 1.5; color: #dfe5ff">Bears have been at Elderton. It lies east, 300 paces off.</div>
    <div style="background: rgba(6, 9, 22, 0.58); border-left: 3px solid rgba(214,221,255,0.2); padding: 7px 12px; font-size: 10px; line-height: 1.5; color: #aab4d8">Lise, the storekeeper, has a horse to sell.</div>
  </div>

  <!-- ── bottom-left: where the thumb walks. Marked, not drawn — the ring only
       appears under a finger, so at rest this corner is world. ────────────────── -->
  <div style="position: absolute; left: 22px; bottom: 22px; width: 74px; height: 74px; border: 1px dashed rgba(214,221,255,0.22); display: flex; align-items: center; justify-content: center">
    <span style="width: 30px; height: 30px; background: rgba(10,13,28,0.5); border: 1px solid rgba(214,221,255,0.28)"></span>
  </div>
  <span style="position: absolute; left: 22px; bottom: 4px; font-size: 8px; letter-spacing: 2px; color: rgba(223,229,255,0.4)">THUMB — SHOWN ONLY WHEN TOUCHED</span>

  <!-- ── bottom-right: what you can do. Squares, because the world is cut squares ── -->
  <div style="position: absolute; right: 0; bottom: 0; display: flex; align-items: flex-end">
    <div style="display: flex; flex-direction: column; border-left: 1px solid rgba(214,221,255,0.14)">
      <span style="width: 52px; height: 52px; background: rgba(10,13,28,0.62); border-bottom: 1px solid rgba(214,221,255,0.14); display: flex; align-items: center; justify-content: center">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#eef2ff" stroke-width="1.6"><path d="M6 20l4-4M4 18l2 2"/><path d="M9 15L19 5V3h-2L7 13"/></svg>
      </span>
      <span style="width: 52px; height: 52px; background: rgba(10,13,28,0.62); display: flex; align-items: center; justify-content: center">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#eef2ff" stroke-width="1.6"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></svg>
      </span>
    </div>
    <span style="width: 76px; height: 104px; background: rgba(150,140,255,0.5); border-left: 1px solid rgba(214,221,255,0.34); border-top: 1px solid rgba(214,221,255,0.34); display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: 3px; color: #fff">USE</span>
  </div>

  <div style="position: absolute; left: 0; top: 50%; transform: translateY(-50%); background: rgba(6,9,22,0.55); padding: 5px 10px; font-size: 8px; color: #8f9ac4; letter-spacing: 2px; writing-mode: vertical-rl">A · CUT STONE — PHONE, SIDEWAYS</div>
</div>
</x-dc>
</body>
</html>
